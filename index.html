<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>TUX - نظام إدارة المحل (سحابي)</title>
<style>
  :root{
    --navy:#0B0B0C; --navy-mid:#161616; --navy-light:#242422;
    --gold:#C9A227; --gold-soft:#E8CD73;
    --cream:#F6F2E7; --paper:#FDFCF8;
    --ink:#20242B; --ink-soft:#5B5F68; --line:#E6E0CE;
    --green:#4C7A5A; --green-bg:#EAF2EC;
    --amber:#B8860B; --amber-bg:#FBF3E1;
    --red:#A63D40; --red-bg:#FBEBEC;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--cream);
    font-family:-apple-system,'Segoe UI',Tahoma,Arial,'Noto Sans Arabic',sans-serif; color:var(--ink); }
  input,select,textarea,button{ font-family:inherit; font-size:15px; }
  button{ cursor:pointer; }
  h1,h2,p{ margin:0; }
  .icon{ display:inline-block; vertical-align:middle; line-height:0; }
  .icon svg{ display:block; }

  .input{ width:100%; box-sizing:border-box; padding:11px 14px; border-radius:10px;
    border:1px solid var(--line); font-size:15px; background:#fff; color:var(--ink); outline:none; }
  .label{ display:block; font-size:13px; color:var(--ink-soft); margin-bottom:6px; font-weight:500; }
  .btn-primary{ width:100%; padding:12px 14px; border-radius:10px; border:none;
    background:var(--navy); color:var(--gold-soft); font-size:15px; font-weight:700; }
  .btn-primary:disabled{ opacity:0.55; }
  .btn-secondary{ width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line);
    background:#fff; color:var(--ink); font-size:15px; font-weight:600; }
  .btn-danger{ width:100%; padding:12px 14px; border-radius:10px; border:none;
    background:var(--red); color:#fff; font-size:15px; font-weight:700; }
  .btn-add{ display:flex; align-items:center; gap:6px; padding:9px 14px; border-radius:10px;
    border:none; background:var(--navy); color:var(--gold-soft); font-size:13.5px; font-weight:600; flex-shrink:0; }
  .btn-icon{ width:32px; height:32px; border-radius:8px; border:1px solid var(--line);
    background:#fff; display:flex; align-items:center; justify-content:center; }
  .err{ color:var(--red); font-size:13px; margin-bottom:12px; text-align:center; }
  .field{ margin-bottom:14px; }

  .tape{ width:100%; height:14px; display:block; margin:14px 0; }

  .sidebar{ position:sticky; top:0; height:100vh; width:240px; background:var(--navy);
    z-index:50; display:flex; flex-direction:column; flex-shrink:0; }
  .sidebar-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:40; display:none; }
  .navitem{ width:100%; display:flex; align-items:center; gap:10px; padding:10px 12px;
    margin-bottom:3px; border-radius:9px; border:none; background:transparent;
    color:rgba(255,255,255,0.75); font-size:14px; cursor:pointer; text-align:right; }
  .navitem.active{ background:var(--navy-light); color:var(--gold-soft); font-weight:600; }
  .navitem .soon{ font-size:9.5px; color:rgba(255,255,255,0.35); border:1px solid rgba(255,255,255,0.2);
    border-radius:20px; padding:1px 6px; margin-right:auto; }
  .sidebar-foot-btn{ width:100%; display:flex; align-items:center; justify-content:center; gap:8px;
    padding:10px 12px; border-radius:9px; border:1px solid rgba(255,255,255,0.15);
    background:transparent; color:rgba(255,255,255,0.65); font-size:13px; }

  .main{ flex:1; min-width:0; }
  .topbar{ display:none; align-items:center; gap:10px; padding:14px 16px; background:var(--navy); }
  .content{ max-width:760px; margin:0 auto; padding:24px 18px 60px; }

  .card{ background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .row{ display:flex; align-items:center; gap:12px; }
  .badge{ font-size:11px; padding:2px 8px; border-radius:20px; font-weight:600; }
  .empty{ text-align:center; padding:50px 20px; color:var(--ink-soft); }

  .modal-backdrop{ position:fixed; inset:0; background:rgba(19,28,49,0.55); z-index:100;
    display:flex; align-items:flex-end; justify-content:center; }
  .modal-sheet{ width:100%; max-width:460px; background:var(--paper); border-radius:18px 18px 0 0;
    padding:20px 20px 26px; max-height:88vh; overflow-y:auto; }
  .confirm-backdrop{ position:fixed; inset:0; background:rgba(19,28,49,0.55); z-index:110;
    display:flex; align-items:center; justify-content:center; padding:24px; }
  .confirm-box{ background:var(--paper); border-radius:14px; padding:22px; max-width:320px;
    width:100%; text-align:center; }

  .auth-wrap{ min-height:100vh; background:linear-gradient(180deg,var(--navy) 0%,var(--navy-mid) 100%);
    display:flex; align-items:center; justify-content:center; padding:24px; }
  .auth-card{ width:100%; max-width:380px; background:var(--paper); border-radius:16px;
    padding:32px 28px; box-shadow:0 20px 60px rgba(0,0,0,0.35); }

  .sync-badge{ position:fixed; bottom:10px; left:10px; z-index:999; font-size:10.5px;
    color:#8a8a80; background:rgba(255,255,255,0.9); padding:3px 9px; border-radius:20px;
    border:1px solid #e6e0ce; display:flex; align-items:center; gap:5px; }
  .sync-dot{ width:6px; height:6px; border-radius:50%; background:var(--green); flex-shrink:0; }
  .sync-dot.off{ background:var(--red); }

  @media (max-width: 780px){
    .sidebar{ position:fixed !important; top:0; right:-260px; transition:right .25s ease; }
    .sidebar.open{ right:0 !important; }
    .sidebar-overlay.show{ display:block; }
    .topbar{ display:flex !important; }
  }
</style>
</head>

<div id="app"></div>

<script>
"use strict";

/* =========================================================
   Firestore over plain REST (no streaming/websocket layer —
   works on restrictive mobile networks that block long-lived connections)
   ========================================================= */
const PROJECT_ID = "tux-stores";
const API_KEY = "AIzaSyD5nDjqJqNYwx99yciBzsL1527w3Z5XYis";
const FS_BASE = "https://firestore.googleapis.com/v1/projects/" + PROJECT_ID + "/databases/tuxstores/documents";

function fsEncodeValue(v){
  if (typeof v === "number") {
    return Number.isInteger(v) ? { integerValue: String(v) } : { doubleValue: v };
  }
  return { stringValue: v == null ? "" : String(v) };
}
function fsEncodeFields(obj){
  const fields = {};
  for (const k in obj) fields[k] = fsEncodeValue(obj[k]);
  return { fields: fields };
}
function fsDecodeValue(v){
  if (!v) return "";
  if ("stringValue" in v) return v.stringValue;
  if ("integerValue" in v) return Number(v.integerValue);
  if ("doubleValue" in v) return Number(v.doubleValue);
  if ("booleanValue" in v) return v.booleanValue;
  return "";
}
function fsDecodeDoc(doc){
  const obj = {};
  const fields = doc.fields || {};
  for (const k in fields) obj[k] = fsDecodeValue(fields[k]);
  return obj;
}
async function fsGetDoc(collection, id){
  const res = await fetch(FS_BASE + "/" + collection + "/" + id + "?key=" + API_KEY);
  if (res.status === 404) return null;
  if (!res.ok) {
    let detail = "";
    try { detail = (await res.json()).error.message; } catch(e2){}
    throw new Error("fs get " + res.status + (detail ? " - " + detail : ""));
  }
  return fsDecodeDoc(await res.json());
}
async function fsSetDoc(collection, id, data){
  const res = await fetch(FS_BASE + "/" + collection + "/" + id + "?key=" + API_KEY, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(fsEncodeFields(data)),
  });
  if (!res.ok) {
    let detail = "";
    try { detail = (await res.json()).error.message; } catch(e2){}
    throw new Error("fs set " + res.status + (detail ? " - " + detail : ""));
  }
}
async function fsDeleteDoc(collection, id){
  const res = await fetch(FS_BASE + "/" + collection + "/" + id + "?key=" + API_KEY, { method: "DELETE" });
  if (!res.ok && res.status !== 404) throw new Error("fs delete " + res.status);
}
async function fsList(collection){
  const res = await fetch(FS_BASE + "/" + collection + "?key=" + API_KEY + "&pageSize=300");
  if (!res.ok) {
    let detail = "";
    try { detail = (await res.json()).error.message; } catch(e2){}
    throw new Error("fs list " + res.status + (detail ? " - " + detail : ""));
  }
  const data = await res.json();
  const docs = data.documents || [];
  return docs.map(function (d) {
    const id = d.name.split("/").pop();
    const obj = fsDecodeDoc(d);
    obj.id = obj.id || id;
    return obj;
  });
}

async function fsGetList(name){
  const doc = await fsGetDoc("config", name);
  if (!doc || !doc.data) return [];
  try { return JSON.parse(doc.data); } catch(e){ return []; }
}
async function fsSaveList(name, arr){
  await fsSetDoc("config", name, { data: JSON.stringify(arr) });
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function tapeRule(color){
  color = color || "var(--gold)";

  for (let i=0;i<60;i++){
    const x = (i/60*100).toFixed(2)+"%";
    const y1 = i%5===0 ? 2 : 5, y2 = i%5===0 ? 12 : 9;
    const op = i%5===0 ? 0.55 : 0.3;
    ticks += '<line x1="'+x+'" x2="'+x+'" y1="'+y1+'" y2="'+y2+'" stroke="'+color+'" stroke-width="1" opacity="'+op+'"/>';
  }
  return '<svg class="tape" preserveAspectRatio="none"><line x1="0" y1="7" x2="100%" y2="7" stroke="'+color+'" stroke-width="1" opacity="0.4"/>'+ticks+'</svg>';
}

const PERMISSION_MODULES = MODULES.filter(m => m.key !== "dashboard").map(m => ({ key:m.key, label:m.label }));
function defaultPermissions(){
  const p = {};
  PERMISSION_MODULES.forEach(m => { p[m.key] = (m.key !== "profits"); }); // revenue/profit hidden by default for new staff
  return p;
}
function userPermissions(user){
  if (!user) return defaultPermissions();
  if (user.role === "admin") return null; // null = unrestricted
  return Object.assign(defaultPermissions(), user.permissions || {});
}
function canAccess(moduleKey){
  if (moduleKey === "dashboard") return true;
  if (state.userRole === "admin") return true;
  if (!state.userPermissions) return true; // safety fallback
  return state.userPermissions[moduleKey] !== false;
}

function todayStr(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function dateOffsetStr(days){
  const d = new Date();
  d.setDate(d.getDate() + days);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function inDateRange(dateStr, from, to){
  if (!dateStr) return false;
  if (from && dateStr < from) return false;
  if (to && dateStr > to) return false;
  return true;
}
function dateRangeHtml(prefix, fromVal, toVal){
  return '<div style="display:flex;gap:8px;margin-bottom:10px">' +
      '<div style="flex:1"><label class="label">من تاريخ</label><input class="input" type="date" id="'+prefix+'From" value="'+esc(fromVal)+'"/></div>' +
      '<div style="flex:1"><label class="label">إلى تاريخ</label><input class="input" type="date" id="'+prefix+'To" value="'+esc(toVal)+'"/></div>' +
    '</div>' +
    '<div style="display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap">' +
      '<button type="button" class="chip" data-range-preset="'+prefix+'|today" style="padding:5px 11px;border-radius:20px;border:1px solid var(--line);background:#fff;font-size:12px;color:var(--navy);cursor:pointer">اليوم</button>' +
      '<button type="button" class="chip" data-range-preset="'+prefix+'|week" style="padding:5px 11px;border-radius:20px;border:1px solid var(--line);background:#fff;font-size:12px;color:var(--navy);cursor:pointer">آخر 7 أيام</button>' +

      '<button type="button" class="chip" data-range-preset="'+prefix+'|all" style="padding:5px 11px;border-radius:20px;border:1px solid var(--gold);background:var(--cream);font-size:12px;color:var(--navy);cursor:pointer">كل الفترات</button>' +
    '</div>';
}
function resolveRangePreset(preset){
  const today = todayStr();
  if (preset === "today") return { from:today, to:today };
  if (preset === "week") return { from:dateOffsetStr(-6), to:today };
  if (preset === "month") return { from: monthKeyOf(today)+"-01", to: today };
  return { from:"", to:"" };
}
function bindDateRangeEvents(prefix, setRange, onChange){
  const fromEl = document.getElementById(prefix+"From");
  const toEl = document.getElementById(prefix+"To");
  if (fromEl) fromEl.addEventListener("change", () => { setRange(fromEl.value, toEl ? toEl.value : ""); onChange(); });
  if (toEl) toEl.addEventListener("change", () => { setRange(fromEl ? fromEl.value : "", toEl.value); onChange(); });
  document.querySelectorAll('[data-range-preset^="'+prefix+'|"]').forEach(btn => {
    btn.addEventListener("click", () => {
      const preset = btn.getAttribute("data-range-preset").split("|")[1];
      const r = resolveRangePreset(preset);
      setRange(r.from, r.to);
      onChange();
    });
  });
}

function bindAuthEvents(){
  const retry = document.getElementById("retryBoot");
  if (retry){ retry.addEventListener("click", boot); return; }

  const form = document.getElementById("authForm");
  const isSetup = state.bootPhase === "setup";
  form.addEventListener("submit", async function(e){
    e.preventDefault();
    const errEl = document.getElementById("authErr");
    const submitBtn = document.getElementById("authSubmit");
    function showErr(msg){ errEl.textContent = msg; errEl.style.display = "block"; }
    const username = document.getElementById("f_user").value.trim();
    const pin = document.getElementById("f_pin").value;

    if (isSetup){
      const shopName = document.getElementById("f_shop").value.trim();
      const pin2 = document.getElementById("f_pin2").value;
      if (!shopName) return showErr("اكتب اسم المحل");
      if (!username) return showErr("اختار اسم مستخدم");
      if (pin.length < 4) return showErr("كلمة السر لازم 4 أرقام على الأقل");
      if (pin !== pin2) return showErr("كلمة السر مش متطابقة");
      submitBtn.disabled = true; submitBtn.textContent = "جاري الإنشاء...";
      try {
        const firstUser = { id:uid(), username:username, pin:pin, role:"admin" };
        await fsSetDoc("config", "shop", { shopName:shopName });
        await fsSaveList("users", [firstUser]);
        state.shopName = shopName; state.username = username; state.userRole = "admin"; state.userPermissions = null; state.authed = true;
        afterLogin();
      } catch(err){
        submitBtn.disabled = false; submitBtn.textContent = "إنشاء الحساب والدخول";
        showErr("خطأ: " + (err && err.message ? err.message : err));
      }
    } else {
      if (!username) return showErr("اكتب اسم المستخدم");
      submitBtn.disabled = true; submitBtn.textContent = "جاري الدخول...";
      try {
        const users = await fsGetList("users");
        const match = users.find(u => u.username.trim().toLowerCase() === username.toLowerCase() && u.pin === pin);
        if (match){
          state.username = match.username; state.userRole = match.role || "staff"; state.userPermissions = userPermissions(match); state.authed = true;
          afterLogin();
        } else {
          submitBtn.disabled = false; submitBtn.textContent = "دخول";
          showErr("اسم المستخدم أو كلمة السر غلط");
        }
      } catch(err){
        submitBtn.disabled = false; submitBtn.textContent = "دخول";
        showErr("خطأ: " + (err && err.message ? err.message : err));
      }
    }
  });
}

/* =========================================================
   cloud sync via polling (plain REST calls, no persistent
   connection — refreshes every few seconds)
   ========================================================= */
let pollTimer = null;
function subscribeData(){
  pollOnce();
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(pollOnce, 4000);
}
async function pollOnce(){
  try {
    const [inv, cust, rent, sale, tailor, sup, acc, exp, pkg, closedM] = await Promise.all([
      fsGetList("inventory"), fsGetList("customers"),
      fsGetList("rentals"), fsGetList("sales"), fsGetList("tailor"),
      fsGetList("suppliers"), fsGetList("accounts"),
      fsGetList("expenses"), fsGetList("packages"), fsGetList("closedMonths")
    ]);
    inv.sort((a,b) => (b._ts||0) - (a._ts||0));
    cust.sort((a,b) => (b._ts||0) - (a._ts||0));
    rent.sort((a,b) => (b._ts||0) - (a._ts||0));
    sale.sort((a,b) => (b._ts||0) - (a._ts||0));
    tailor.sort((a,b) => (b._ts||0) - (a._ts||0));
    sup.sort((a,b) => (b._ts||0) - (a._ts||0));
    acc.sort((a,b) => (b._ts||0) - (a._ts||0));
    exp.sort((a,b) => (b._ts||0) - (a._ts||0));
    pkg.sort((a,b) => (b._ts||0) - (a._ts||0));
    state.inventory = inv;
    state.customers = cust;
    state.rentals = rent;
    state.sales = sale;
    state.tailorOrders = tailor;
    state.suppliers = sup;
    state.accountEntries = acc;
    state.expenses = exp;
    state.packages = pkg;
    state.closedMonths = closedM || [];
    state.invLoaded = true;
    state.custLoaded = true;
    state.rentalsLoaded = true;
    state.salesLoaded = true;
    state.tailorLoaded = true;
    state.suppliersLoaded = true;
    state.accountsLoaded = true;
    state.expensesLoaded = true;
    state.packagesLoaded = true;
    state.closedMonthsLoaded = true;
    state.online = true;
    onDataChanged();
  } catch (e){
    state.online = false;
    renderSyncBadge();
  }
}

function onDataChanged(){
  renderSyncBadge();
  if (!state.authed) return;
  if (state.view === "inventory" && document.getElementById("invList")) refreshInventoryList();
  if (state.view === "customers" && document.getElementById("custList")) refreshCustomersList();
  if (state.view === "rental" && document.getElementById("rentalList")) refreshRentalList();
  if (state.view === "sales" && document.getElementById("salesList")) refreshSalesList();
  if (state.view === "tailor" && document.getElementById("tailorList")) refreshTailorList();
  if (state.view === "suppliers" && document.getElementById("supplierList")) refreshSuppliersList();
  if (state.view === "accounts" && document.getElementById("accountsContent")) refreshAccountsView();
  if (state.view === "expenses" && document.getElementById("expensesContent")) refreshExpensesContent();
  if (state.view === "packages" && document.getElementById("packageList")) refreshPackagesList();
  if (state.view === "profits" && document.getElementById("profitsContent")) refreshProfitsContent();
  if (state.view === "reports" && document.getElementById("reportsContent")) refreshReportsContent();
  if (state.view === "dashboard" && document.getElementById("mainContent")){
    document.getElementById("mainContent").innerHTML = renderDashboard();
    bindShellDashboardClicks();
    bindDashboardEvents();
  }
}

/* =========================================================
   Shell (sidebar + content)
   ========================================================= */
function renderShell(){
  const current = MODULES.find(m => m.key === state.view);
  return '' +
  '<div id="app-inner" style="display:flex;min-height:100vh;background:var(--cream)">' +

      '<div class="topbar"><button id="btnOpenSidebar" style="background:transparent;border:none">'+icon("menu",22,"var(--gold-soft)")+'</button><span style="color:var(--gold-soft);font-weight:700;margin-right:8px">TUX</span></div>' +

        '<img src="'+LOGO_SRC+'" alt="TUX" style="width:100%;height:100%;object-fit:cover"/></div>' +

        '<div style="color:var(--gold-soft);font-weight:700;font-size:15px;letter-spacing:.5px">TUX</div>' +
        '<div style="color:rgba(255,255,255,0.5);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(state.shopName)+'</div>' +
        '<div style="color:var(--gold);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px">مسجل دخول: '+esc(state.username)+(isAdmin()?' (أدمن)':'')+'</div>' +

function pageHeader(iconName, title, subtitle, actionHtml){

    '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px">' +
      '<div class="row" style="gap:10px">' +

        '<div><h1 style="font-size:19px;color:var(--navy);font-weight:700">'+esc(title)+'</h1>' +

function renderMainContent(current){
  if (!canAccess(state.view)){
    return pageHeader("warn","معندكش صلاحية", "كلّم الأدمن لو محتاج تدخل الجزء ده") +
      '<div class="card" style="padding:40px 20px;text-align:center">' +
        icon("warn",34,"var(--amber)") +
        '<div style="font-size:14px;color:var(--ink-soft);margin-top:10px">حساب ("'+esc(state.username)+'") معندوش صلاحية الوصول للجزء ده. كلّم الأدمن لو محتاج الصلاحية دي.</div>' +
      '</div>';
  }
  if (state.view === "dashboard") return renderDashboard();
  if (state.view === "inventory") return renderInventory();
  if (state.view === "customers") return renderCustomers();
  if (state.view === "rental") return renderRental();
  if (state.view === "sales") return renderSales();
  if (state.view === "tailor") return renderTailor();
  if (state.view === "suppliers") return renderSuppliers();

function renderComingSoon(current){

      '<div style="margin-bottom:12px">'+icon(current.icon,38,"var(--gold-soft)")+'</div>' +
      '<div style="font-size:15px;color:var(--navy);font-weight:600;margin-bottom:4px">'+esc(current.label)+' — قريباً</div>' +
      '<div style="font-size:13px;color:var(--ink-soft)">هنبنيه في المرحلة الجاية بعد ما نخلّص المخزون والعملاء</div>' +
    '</div>';
}

/* =========================================================
   Dashboard
   ========================================================= */
function greetingText(){
  const h = new Date().getHours();
  const name = state.username || "";
  let g = "أهلاً بيك";
  if (h < 5) g = "سهرانين لوقت متأخر";
  else if (h < 12) g = "صباح الخير";
  else if (h < 17) g = "مساء النور";
  else g = "مساء الخير";
  return g + (name ? " يا " + name : "");
}

function quickAdd(kind){
  if (kind === "rental"){
    state.view = "rental"; render();
    openModal({ type:"rental", data:{ id:uid(), customerName:"", itemId:"", itemDesc:"", rentDate:todayStr(), dueDate:"", price:"", deposit:"", status:"active", notes:"", stockAdjusted:false } });
  } else if (kind === "sale"){
    state.view = "sales"; render();
    openModal({ type:"sale", data:{ id:uid(), customerName:"", itemId:"", itemDesc:"", quantity:1, unitPrice:"", total:"", date:todayStr(), notes:"" } });
  } else if (kind === "customer"){
    state.view = "customers"; render();
    openModal({ type:"customer", data:{ id:uid(), name:"", phone:"", measurements:"", notes:"" } });
  } else if (kind === "item"){
    state.view = "inventory"; render();
    openModal({ type:"item", data:{ id:uid(), type:"", name:"", size:"", color:"", quantity:1, rentPrice:"", salePrice:"", status:"available" } });
  }
}
function bindDashboardEvents(){
  document.querySelectorAll("[data-quick]").forEach(btn => {
    btn.addEventListener("click", () => quickAdd(btn.getAttribute("data-quick")));
  });
}

function recentActivityHtml(){
  const items = [];
  state.rentals.filter(r => r.createdBy === state.username).forEach(r => items.push({ ts:r._ts||0, icon:"shirt", color:"var(--amber)", text:"إيجار: "+(r.customerName||"—")+" — "+(r.itemDesc||""), amount:r.price }));
  state.sales.filter(s => s.createdBy === state.username).forEach(s => items.push({ ts:s._ts||0, icon:"bag", color:"var(--green)", text:"بيع: "+(s.customerName||"عميل مباشر")+" — "+(s.itemDesc||""), amount:s.total }));
  items.sort((a,b) => b.ts - a.ts);
  const top = items.slice(0,4);
  if (top.length === 0) return '<div style="font-size:12.5px;color:var(--ink-soft);text-align:center;padding:10px">لسه مفيش نشاط ليك، ابدأ بأول عملية</div>';
  return top.map(function(it){
    return '<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)">' +
      '<div style="width:30px;height:30px;border-radius:8px;background:var(--cream);display:flex;align-items:center;justify-content:center;flex-shrink:0">'+icon(it.icon,14,it.color)+'</div>' +
      '<div style="flex:1;min-width:0;font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(it.text)+'</div>' +
      (it.amount ? '<div style="font-size:12.5px;font-weight:700;color:var(--navy);flex-shrink:0">'+esc(it.amount)+' ج.م</div>' : '') +
    '</div>';
  }).join("");
}

function topSalespersonName(){
  const thisMonth = monthKeyOf(todayStr());
  const totals = {};
  state.sales.filter(s => s.createdBy && monthKeyOf(s.date) === thisMonth).forEach(s => {
    totals[s.createdBy] = (totals[s.createdBy]||0) + (Number(s.total)||0);
  });
  let best = null, bestVal = 0;
  Object.keys(totals).forEach(u => { if (totals[u] > bestVal){ bestVal = totals[u]; best = u; } });
  return bestVal > 0 ? best : null;
}

function renderDashboard(){
  if (!state.invLoaded || !state.custLoaded){
    return pageHeader("dashboard","نظرة عامة","ملخص سريع لحالة المحل") +
      '<div class="empty">'+icon("cloud",30,"var(--line)")+'<div style="margin-top:10px;font-size:14px">جاري تحميل البيانات من السحابة...</div></div>';
  }
  const total = state.inventory.length;
  const rented = state.inventory.filter(i => i.status === "rented").length;
  const available = state.inventory.reduce((sum,i) => sum + availableQtyOf(i), 0);
  const lowStock = state.inventory.filter(i => availableQtyOf(i) <= 2).length;
  const cards = [
    { label:"إجمالي القطع", value:total, icon:"package", view:"inventory", color:"var(--navy)" },
    { label:"متاحة الآن", value:available, icon:"check", color:"var(--green)" },
    { label:"مؤجرة حالياً", value:rented, icon:"shirt", color:"var(--amber)" },
    { label:"عدد العملاء", value:state.customers.length, icon:"users", view:"customers", color:"#5B6FA6" },
  ];
  let cardsHtml = "";
  cards.forEach(c => {
    cardsHtml += '<div class="card" style="cursor:'+(c.view?"pointer":"default")+';border-right:3px solid '+c.color+'" '+(c.view?'data-view="'+c.view+'"':'')+'>' +
      '<div style="margin-bottom:8px">'+icon(c.icon,18,c.color)+'</div>' +
      '<div style="font-size:22px;font-weight:700;color:var(--navy)">'+c.value+'</div>' +
      '<div style="font-size:12.5px;color:var(--ink-soft);margin-top:2px">'+c.label+'</div></div>';
  });

  const today = todayStr();
  const thisMonth = monthKeyOf(today);
  const salesToday = state.sales.filter(s => s.date === today).reduce((sum,s) => sum + (Number(s.total)||0), 0);
  const rentalsToday = state.rentals.filter(r => r.rentDate === today).reduce((sum,r) => sum + (Number(r.price)||0), 0);
  const salesMonth = state.sales.filter(s => monthKeyOf(s.date) === thisMonth).reduce((sum,s) => sum + (Number(s.total)||0), 0);
  const rentalsMonth = state.rentals.filter(r => monthKeyOf(r.rentDate) === thisMonth).reduce((sum,r) => sum + (Number(r.price)||0), 0);
  const expensesMonth = state.expenses.filter(x => monthKeyOf(x.date) === thisMonth).reduce((sum,x) => sum + (Number(x.amount)||0), 0);
  const netMonth = salesMonth + rentalsMonth - expensesMonth;
  const totalOwedSuppliers = state.suppliers.reduce((sum,s) => { const b = supplierBalance(s.name); return sum + (b>0?b:0); }, 0);

  const quickActions = [
    { kind:"rental", icon:"shirt", label:"إيجار جديد", perm:"rental" },
    { kind:"sale", icon:"bag", label:"بيع جديد", perm:"sales" },
    { kind:"customer", icon:"users", label:"عميل جديد", perm:"customers" },
    { kind:"item", icon:"package", label:"صنف جديد", perm:"inventory" },
  ].filter(q => canAccess(q.perm));
  let quickHtml = "";
  if (quickActions.length > 0){
    quickHtml = '<div style="display:grid;grid-template-columns:repeat('+quickActions.length+',1fr);gap:8px;margin-bottom:20px">';
    quickActions.forEach(q => {
      quickHtml += '<button data-quick="'+q.kind+'" style="display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 4px;border-radius:12px;border:1px solid var(--line);background:var(--paper);cursor:pointer">' +
        '<div style="width:32px;height:32px;border-radius:50%;background:var(--navy);display:flex;align-items:center;justify-content:center">'+icon(q.icon,15,"var(--gold)")+'</div>' +
        '<span style="font-size:10.5px;color:var(--navy);font-weight:600">'+q.label+'</span>' +
      '</button>';
    });
    quickHtml += '</div>';
  }

  const financeBlock = isAdmin() ? (
    '<div style="background:var(--navy);border-radius:14px;padding:16px 18px;margin-bottom:16px">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">' +
        '<span style="color:var(--gold-soft);font-weight:700;font-size:13.5px">إيرادات اليوم</span>' +
        '<span style="color:#fff;font-weight:700;font-size:15px">'+(salesToday+rentalsToday)+' ج.م</span>' +
      '</div>' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.12)">' +
        '<span style="color:rgba(255,255,255,0.7);font-size:12.5px">صافي الربح التقديري هذا الشهر</span>' +
        '<span style="color:'+(netMonth>=0?"#7CD992":"#F0A0A0")+';font-weight:700;font-size:14px">'+netMonth+' ج.م</span>' +
      '</div>' +
      (totalOwedSuppliers > 0 ? '<div style="display:flex;justify-content:space-between;align-items:center;padding-top:10px;border-top:1px solid rgba(255,255,255,0.12);cursor:pointer" data-view="accounts">'+
        '<span style="color:rgba(255,255,255,0.7);font-size:12.5px">إجمالي المستحق للموردين</span>'+
        '<span style="color:#F0A0A0;font-weight:700;font-size:14px">'+totalOwedSuppliers+' ج.م</span></div>' : '') +
    '</div>'
  ) : "";

  const topSeller = topSalespersonName();
  const topSellerBlock = topSeller ? (
    '<div class="card" style="margin-bottom:14px;display:flex;align-items:center;gap:10px;background:'+(topSeller===state.username?"var(--amber-bg)":"var(--paper)")+';border-color:'+(topSeller===state.username?"var(--gold)":"var(--line)")+'">' +
      '<div style="width:34px;height:34px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px">🏆</div>' +
      '<div style="flex:1;min-width:0">' +
        '<div style="font-size:12px;color:var(--ink-soft)">أعلى مبيعات الشهر</div>' +
        '<div style="font-size:14px;font-weight:700;color:var(--navy)">'+esc(topSeller)+(topSeller===state.username?' (أنت! 🎉)':'')+'</div>' +
      '</div>' +
    '</div>'
  ) : "";

  return pageHeader("dashboard", greetingText(), "ملخص سريع لحالة "+(state.shopName||"المحل")) +
    quickHtml +
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px">'+cardsHtml+'</div>' +
    (lowStock > 0 ? '<div class="card" style="background:var(--amber-bg);border-color:var(--gold);display:flex;align-items:center;gap:10px;margin-bottom:16px">'+
      icon("warn",17,"var(--amber)")+'<div style="font-size:13px;color:#6b4e0a">في '+lowStock+' صنف الكمية فيه وصلت 2 أو أقل — راجع المخزون</div></div>' : '') +
    financeBlock +
    topSellerBlock +
    '<div class="card" style="margin-bottom:14px">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">' +
        '<span style="font-weight:700;color:var(--navy);font-size:13.5px">آخر نشاطك</span>' +
      '</div>' +
      recentActivityHtml() +
    '</div>' +
    '<div style="text-align:center;font-size:10.5px;color:var(--ink-soft)">'+icon("cloud",11,"var(--green)")+' متصل بالسحابة — بياناتك متزامنة على أي جهاز</div>';
}

/* =========================================================
   Inventory
   ========================================================= */
function filteredInventory(){
  const q = state.invQuery.toLowerCase();
  return state.inventory.filter(it => {
    const matchQ = !q || it.name.toLowerCase().includes(q) || it.color.toLowerCase().includes(q) || it.size.toLowerCase().includes(q);
    const matchType = state.invType === "الكل" || it.type === state.invType;
    return matchQ && matchType;
  });
}

function inventoryListHtml(){
  const list = filteredInventory();
  if (!state.invLoaded){
    return '<div class="empty">'+icon("cloud",30,"var(--line)")+'<div style="margin-top:10px;font-size:14px">جاري التحميل من السحابة...</div></div>';
  }
  if (list.length === 0){
    return '<div class="empty">'+icon("package",34,"var(--line)")+'<div style="margin-top:10px;font-size:14px">'+
      (state.inventory.length===0 ? "لسه مفيش أصناف — ابدأ بإضافة أول صنف" : "مفيش نتائج مطابقة")+'</div></div>';
  }
  return '<div style="display:flex;flex-direction:column;gap:10px">' + list.map(item => {
    const st = statusOf(item.status);
    const avail = availableQtyOf(item);
    const low = avail <= 2;
    return '<div class="card row">' +
      '<div style="width:40px;height:40px;border-radius:10px;background:var(--cream);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;color:var(--navy);font-weight:700">'+esc(item.type[0])+'</div>' +
      '<div style="flex:1;min-width:0">' +
        '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">' +
          '<span style="font-weight:600;color:var(--navy);font-size:14.5px">'+esc(item.name || item.type)+'</span>' +
          '<span class="badge" style="background:'+st.bg+';color:'+st.color+'">'+st.label+'</span>' +
          (low ? '<span style="font-size:11px;color:var(--red);display:flex;align-items:center;gap:3px">'+icon("warn",11)+' كمية قليلة</span>' : '') +
        '</div>' +
        '<div style="font-size:12.5px;color:var(--ink-soft);margin-top:3px">'+esc(item.type)+' · مقاس '+esc(item.size||"—")+' · '+esc(item.color||"بدون لون محدد")+' · متاح '+avail+' من '+item.quantity+'</div>' +
        (item.rentPrice || item.salePrice ? '<div style="font-size:12px;color:var(--navy);margin-top:3px;display:flex;gap:10px">'+
          (item.rentPrice ? '<span>إيجار: <b>'+esc(item.rentPrice)+'</b> ج.م</span>' : '') +
          (item.salePrice ? '<span>بيع: <b>'+esc(item.salePrice)+'</b> ج.م</span>' : '') +
        '</div>' : '') +
      '</div>' +
      '<div style="display:flex;gap:6px;flex-shrink:0">' +
        '<button class="btn-icon" data-edit-item="'+item.id+'">'+icon("pencil",15,"var(--navy)")+'</button>' +
        '<button class="btn-icon" data-del-item="'+item.id+'">'+icon("trash",15,"var(--red)")+'</button>' +
      '</div></div>';
  }).join("") + '</div>';
}

function distinctTypes(){
  const set = {};
  state.inventory.forEach(it => { if (it.type) set[it.type] = true; });
  return Object.keys(set).sort();
}

function renderInventory(){
  let typeOptions = '<option>الكل</option>';
  distinctTypes().forEach(t => typeOptions += '<option'+(state.invType===t?" selected":"")+'>'+t+'</option>');
  return pageHeader("package","المخزون", state.inventory.length+" صنف مسجل",
      '<button class="btn-add" id="btnAddItem">'+icon("plus",16)+' صنف واحد</button>') +
    '<button class="btn-add" id="btnBulkAddItem" style="justify-content:center;width:100%;margin-bottom:16px;background:var(--gold);color:var(--navy)">'+icon("plus",16)+' إضافة دفعة ألوان ومقاسات دفعة واحدة</button>' +
    '<div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">' +
      '<div style="position:relative;flex:1 1 200px">' +
        '<span style="position:absolute;right:12px;top:12px">'+icon("search",15,"var(--ink-soft)")+'</span>'+
        '<input class="input" style="padding-right:36px" id="invSearch" placeholder="ابحث بالاسم أو اللون أو المقاس" value="'+esc(state.invQuery)+'"/></div>' +
      '<select class="input" style="width:auto;flex:0 0 auto" id="invTypeFilter">'+typeOptions+'</select>' +
    '</div>' +
    '<div id="invList">' + inventoryListHtml() + '</div>';
}

/* =========================================================
   Customers
   ========================================================= */
function filteredCustomers(){
  const q = state.custQuery.toLowerCase();
  return state.customers.filter(c => !q || c.name.toLowerCase().includes(q) || c.phone.includes(state.custQuery));
}

function customersListHtml(){
  const list = filteredCustomers();
  if (!state.custLoaded){
    return '<div class="empty">'+icon("cloud",30,"var(--line)")+'<div style="margin-top:10px;font-size:14px">جاري التحميل من السحابة...</div></div>';
  }
  if (list.length === 0){
    return '<div class="empty">'+icon("users",34,"var(--line)")+'<div style="margin-top:10px;font-size:14px">'+
      (state.customers.length===0 ? "لسه مفيش عملاء — ابدأ بإضافة أول عميل" : "مفيش نتائج مطابقة")+'</div></div>';
  }
  return '<div style="display:flex;flex-direction:column;gap:10px">' + list.map(c => {

/* =========================================================
   Expenses (المصروفات)
   ========================================================= */
function filteredExpenses(){
  const q = state.expenseQuery.toLowerCase();
  const hasRange = state.expenseFrom || state.expenseTo;
  return state.expenses.filter(x => {
    const matchQ = !q || (x.category||"").toLowerCase().includes(q) || (x.notes||"").toLowerCase().includes(q);
    const matchRange = !hasRange || inDateRange(x.date, state.expenseFrom, state.expenseTo);
    return matchQ && matchRange;
  });
}
function expenseMonthGroups(){
  const list = filteredExpenses();
  const groups = {};
  list.forEach(x => {
    const key = monthKeyOf(x.date);
    if (!groups[key]) groups[key] = [];
    groups[key].push(x);
  });
  const keys = Object.keys(groups).sort().reverse();
  return keys.map(k => ({ key:k, label:monthLabelOf(k), items:groups[k], closed: state.closedMonths.indexOf(k) !== -1 }));
}
function expensesListHtml(){
  if (!state.expensesLoaded){
    return '<div class="empty">'+icon("cloud",30,"var(--line)")+'<div style="margin-top:10px;font-size:14px">جاري التحميل من السحابة...</div></div>';
  }
  const groups = expenseMonthGroups();
  if (groups.length === 0){
    return '<div class="empty">'+icon("receipt",34,"var(--line)")+'<div style="margin-top:10px;font-size:14px">'+
      (state.expenses.length===0 ? "لسه مفيش مصروفات مسجلة — ابدأ بإضافة أول مصروف" : "مفيش نتائج مطابقة للفترة أو البحث ده")+'</div></div>';
  }
  return groups.map(g => {
    const subtotal = g.items.reduce((sum,x) => sum + (Number(x.amount)||0), 0);
    const header = '<div style="display:flex;align-items:center;justify-content:space-between;margin:4px 2px 10px">' +
      '<div style="display:flex;align-items:center;gap:8px">' +
        '<span style="font-weight:700;color:var(--navy);font-size:14px">'+esc(g.label)+'</span>' +
        (g.closed ? '<span class="badge" style="background:var(--green-bg);color:var(--green)">مقفول</span>' : '<span class="badge" style="background:var(--amber-bg);color:var(--amber)">مفتوح</span>') +
      '</div>' +
      '<div style="display:flex;align-items:center;gap:10px">' +
        '<span style="font-size:13px;font-weight:700;color:var(--red)">'+subtotal+' ج.م</span>' +
        (g.key ? (g.closed ?
          '<button data-reopen-month="'+esc(g.key)+'" style="font-size:11px;color:var(--ink-soft);background:none;border:none;text-decoration:underline;cursor:pointer">فتح تاني</button>' :
          '<button data-close-month="'+esc(g.key)+'" style="font-size:11px;color:var(--navy);background:var(--cream);border:1px solid var(--line);border-radius:20px;padding:4px 10px;cursor:pointer">'+icon("check",11)+' قفل الشهر</button>'
        ) : '') +
      '</div>' +
    '</div>';
    const cards = g.items.map(x => {
      const editButtons = g.closed ? '' :
        '<div style="display:flex;gap:6px;flex-shrink:0">' +
          '<button class="btn-icon" data-edit-expense="'+x.id+'">'+icon("pencil",15,"var(--navy)")+'</button>' +
          '<button class="btn-icon" data-del-expense="'+x.id+'">'+icon("trash",15,"var(--red)")+'</button>' +
        '</div>';
      return '<div class="card row" style="'+(g.closed?"opacity:0.75":"")+'">' +
        '<div style="width:38px;height:38px;border-radius:10px;background:var(--cream);display:flex;align-items:center;justify-content:center;flex-shrink:0">'+icon("receipt",17,"var(--navy)")+'</div>' +
        '<div style="flex:1;min-width:0">' +
          '<div style="font-weight:600;color:var(--navy);font-size:14.5px">'+esc(x.category||"—")+'</div>' +
          '<div style="font-size:12px;color:var(--ink-soft);margin-top:2px">'+(x.date?esc(x.date):"")+(x.notes?' · '+esc(x.notes):'')+'</div>' +
        '</div>' +
        '<div style="font-weight:700;color:var(--red);font-size:14.5px;flex-shrink:0">'+esc(x.amount)+' ج.م</div>' +
        editButtons +
      '</div>';
    }).join("");
    return '<div style="margin-bottom:20px">' + header + '<div style="display:flex;flex-direction:column;gap:10px">' + cards + '</div></div>';
  }).join("");
}
function expensesContentHtml(){
  const filtered = filteredExpenses();
  const total = filtered.reduce((sum,x) => sum + (Number(x.amount)||0), 0);
  const hasRange = state.expenseFrom || state.expenseTo;
  return (state.expenses.length>0 ? '<div class="card" style="background:var(--navy);border:none;margin-bottom:16px"><div style="color:var(--gold-soft);font-size:13px">'+(hasRange?"إجمالي مصروفات الفترة المحددة":"إجمالي المصروفات (كل الفترة)")+'</div><div style="color:#fff;font-size:22px;font-weight:700;margin-top:2px">'+total+' ج.م</div></div>' : '') +
    dateRangeHtml("exp", state.expenseFrom, state.expenseTo) +
    '<div style="position:relative;margin-bottom:16px">' +
      '<span style="position:absolute;right:12px;top:12px">'+icon("search",15,"var(--ink-soft)")+'</span>' +
      '<input class="input" style="padding-right:36px" id="expenseSearch" placeholder="ابحث بنوع المصروف أو ملاحظة" value="'+esc(state.expenseQuery)+'"/></div>' +
    '<div id="expenseList">' + expensesListHtml() + '</div>';
}
function renderExpenses(){

      '<button class="btn-add" id="btnAddExpense">'+icon("plus",16)+' مصروف جديد</button>') +

}

}

/* =========================================================
   Profits (الأرباح) — computed, read-only
   ========================================================= */
function profitsContentHtml(){
  const from = state.profitsFrom, to = state.profitsTo;
  const hasRange = from || to;
  const inRange = (d) => !hasRange || inDateRange(d, from, to);
  const salesRevenue = state.sales.filter(s => inRange(s.date)).reduce((sum,s) => sum + (Number(s.total)||0), 0);
  const rentalRevenue = state.rentals.filter(r => inRange(r.rentDate)).reduce((sum,r) => sum + (Number(r.price)||0), 0);
  const totalExpenses = state.expenses.filter(x => inRange(x.date)).reduce((sum,x) => sum + (Number(x.amount)||0), 0);
  const supplierPurchases = state.accountEntries.filter(e => e.type==="purchase" && inRange(e.date)).reduce((sum,e) => sum + (Number(e.amount)||0), 0);
  const totalRevenue = salesRevenue + rentalRevenue;
  const totalCosts = totalExpenses + supplierPurchases;
  const net = totalRevenue - totalCosts;
  const cards = [
    { label:"إيرادات المبيعات", value:salesRevenue, icon:"bag", color:"var(--green)" },
    { label:"إيرادات الإيجار", value:rentalRevenue, icon:"shirt", color:"var(--green)" },
    { label:"المصروفات", value:totalExpenses, icon:"receipt", color:"var(--red)" },
    { label:"مشتريات من الموردين", value:supplierPurchases, icon:"truck", color:"var(--red)" },
  ];
  let cardsHtml = "";
  cards.forEach(c => {
    cardsHtml += '<div class="card">' +
      '<div style="margin-bottom:8px">'+icon(c.icon,18,c.color)+'</div>' +
      '<div style="font-size:19px;font-weight:700;color:var(--navy)">'+c.value+' <span style="font-size:11px;font-weight:400;color:var(--ink-soft)">ج.م</span></div>' +
      '<div style="font-size:12px;color:var(--ink-soft);margin-top:2px">'+c.label+'</div></div>';
  });
  return dateRangeHtml("prof", from, to) +
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px">'+cardsHtml+'</div>' +
    '<div class="card" style="background:var(--navy);border:none;margin-bottom:16px;padding:20px">' +
      '<div style="color:var(--gold-soft);font-size:13px;margin-bottom:4px">صافي الربح التقديري'+(hasRange?" للفترة المحددة":"")+'</div>' +
      '<div style="color:'+(net>=0?"#7CD992":"#F0A0A0")+';font-size:28px;font-weight:700">'+net+' ج.م</div>' +
    '</div>' +
    '<div style="font-size:12px;color:var(--ink-soft);background:var(--cream);border-radius:8px;padding:10px 12px">' +
      'ده رقم تقديري بيحسب: (إيرادات المبيعات + إيرادات الإيجار) − (المصروفات + المشتريات من الموردين) لنفس الفترة المحددة. مبياخدش في الاعتبار حاجات زي التأمينات المستردة أو تعديلات يدوية.' +
    '</div>';
}
function renderProfits(){
  if (!state.salesLoaded || !state.rentalsLoaded || !state.expensesLoaded || !state.accountsLoaded){
    return pageHeader("trending","الأرباح","تقدير الأرباح لفترة محددة") +
      '<div class="empty">'+icon("cloud",30,"var(--line)")+'<div style="margin-top:10px;font-size:14px">جاري تحميل البيانات من السحابة...</div></div>';
  }
  return pageHeader("trending","الأرباح","تقدير الأرباح لفترة محددة") +
    '<div id="profitsContent">' + profitsContentHtml() + '</div>';
}

/* =========================================================
   Reports (التقارير) — computed, read-only
   ========================================================= */
function reportsContentHtml(){
  const from = state.reportsFrom, to = state.reportsTo;
  const hasRange = from || to;
  const inRange = (d) => !hasRange || inDateRange(d, from, to);

  const activeRentals = state.rentals.filter(r => r.status==="active" || r.status==="late").length;
  const lateRentals = state.rentals.filter(r => r.status==="late").length;
  const pendingTailor = state.tailorOrders.filter(t => t.status==="pending").length;
  const readyTailor = state.tailorOrders.filter(t => t.status==="ready").length;
  const lowStockItems = state.inventory.filter(i => availableQtyOf(i) <= 2);

  // period revenue/expense summary (respects the date range picker)
  const rentalsInRange = state.rentals.filter(r => inRange(r.rentDate));
  const salesInRange = state.sales.filter(s => inRange(s.date));
  const expensesInRange = state.expenses.filter(x => inRange(x.date));
  const periodRevenue = salesInRange.reduce((sum,s) => sum+(Number(s.total)||0),0) + rentalsInRange.reduce((sum,r) => sum+(Number(r.price)||0),0);
  const periodExpenses = expensesInRange.reduce((sum,x) => sum+(Number(x.amount)||0),0);
  const periodNet = periodRevenue - periodExpenses;

  // top rented items (respects the date range picker)
  const rentCount = {};
  rentalsInRange.forEach(r => { const k = r.itemDesc || "—"; rentCount[k] = (rentCount[k]||0) + 1; });
  const topRented = Object.keys(rentCount).sort((a,b) => rentCount[b]-rentCount[a]).slice(0,5);

  const statCards = [
    { label:"عمليات إيجار نشطة", value:activeRentals, icon:"shirt", color:"var(--amber)" },
    { label:"إيجارات متأخرة", value:lateRentals, icon:"warn", color:"var(--red)" },
    { label:"طلبات ترزي قيد التنفيذ", value:pendingTailor, icon:"scissors", color:"var(--amber)" },
    { label:"طلبات ترزي جاهزة للتسليم", value:readyTailor, icon:"check", color:"var(--green)" },
  ];
  let statsHtml = "";
  statCards.forEach(c => {
    statsHtml += '<div class="card">' +
      '<div style="margin-bottom:8px">'+icon(c.icon,18,c.color)+'</div>' +
      '<div style="font-size:22px;font-weight:700;color:var(--navy)">'+c.value+'</div>' +
      '<div style="font-size:12px;color:var(--ink-soft);margin-top:2px">'+c.label+'</div></div>';
  });

  const topRentedHtml = topRented.length === 0 ? '<div style="font-size:12.5px;color:var(--ink-soft)">لسه مفيش بيانات كفاية في الفترة دي</div>' :
    topRented.map(function(k,idx){
      return '<div style="display:flex;justify-content:space-between;padding:8px 0;'+(idx<topRented.length-1?'border-bottom:1px solid var(--line)':'')+'">' +
        '<span style="font-size:13px;color:var(--ink)">'+esc(k)+'</span>' +
        '<span style="font-size:13px;font-weight:700;color:var(--navy)">'+rentCount[k]+' مرة</span>' +
      '</div>';
    }).join("");

  const lowStockHtml = lowStockItems.length === 0 ? '<div style="font-size:12.5px;color:var(--ink-soft)">مفيش أصناف كميتها قليلة حالياً</div>' :
    lowStockItems.slice(0,6).map(function(i){
      return '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)">' +
        '<span style="font-size:13px;color:var(--ink)">'+esc(i.type)+(i.color?" - "+esc(i.color):"")+(i.size?" - مقاس "+esc(i.size):"")+'</span>' +
        '<span style="font-size:13px;font-weight:700;color:var(--red)">متاح '+availableQtyOf(i)+'</span>' +
      '</div>';
    }).join("");

  // monthly report: revenue vs expenses per calendar month (always shows all months, independent of range picker)
  const monthKeys = new Set();
  state.sales.forEach(s => { if (s.date) monthKeys.add(monthKeyOf(s.date)); });
  state.rentals.forEach(r => { if (r.rentDate) monthKeys.add(monthKeyOf(r.rentDate)); });
  state.expenses.forEach(x => { if (x.date) monthKeys.add(monthKeyOf(x.date)); });
  const sortedMonths = Array.from(monthKeys).sort().reverse();
  const monthlyHtml = sortedMonths.length === 0 ? '<div style="font-size:12.5px;color:var(--ink-soft)">لسه مفيش عمليات مؤرخة كفاية</div>' :
    sortedMonths.map(function(mKey){
      const salesRev = state.sales.filter(s => monthKeyOf(s.date)===mKey).reduce((sum,s) => sum+(Number(s.total)||0),0);
      const rentRev = state.rentals.filter(r => monthKeyOf(r.rentDate)===mKey).reduce((sum,r) => sum+(Number(r.price)||0),0);
      const exp = state.expenses.filter(x => monthKeyOf(x.date)===mKey).reduce((sum,x) => sum+(Number(x.amount)||0),0);
      const net = salesRev + rentRev - exp;
      const closed = state.closedMonths.indexOf(mKey) !== -1;
      return '<div style="padding:12px 0;border-bottom:1px solid var(--line)">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">' +
          '<span style="font-weight:700;color:var(--navy);font-size:13.5px">'+esc(monthLabelOf(mKey))+'</span>' +
          (closed ? '<span class="badge" style="background:var(--green-bg);color:var(--green)">مقفول</span>' : '<span class="badge" style="background:var(--amber-bg);color:var(--amber)">مفتوح</span>') +
        '</div>' +
        '<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-bottom:2px"><span>إيرادات</span><span>'+(salesRev+rentRev)+' ج.م</span></div>' +
        '<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-bottom:4px"><span>مصروفات</span><span>'+exp+' ج.م</span></div>' +
        '<div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700"><span style="color:var(--navy)">صافي الشهر</span><span style="color:'+(net>=0?"var(--green)":"var(--red)")+'">'+net+' ج.م</span></div>' +
      '</div>';
    }).join("");

  return dateRangeHtml("rep", from, to) +
    (isAdmin() ? '<div class="card" style="background:var(--navy);border:none;margin-bottom:16px;padding:16px 18px">' +
      '<div style="color:var(--gold-soft);font-size:13px;margin-bottom:8px">ملخص الفترة المحددة'+(!hasRange?" (كل الفترة)":"")+'</div>' +
      '<div style="display:flex;justify-content:space-between;font-size:12.5px;color:rgba(255,255,255,0.75);margin-bottom:4px"><span>إيرادات</span><span>'+periodRevenue+' ج.م</span></div>' +
      '<div style="display:flex;justify-content:space-between;font-size:12.5px;color:rgba(255,255,255,0.75);margin-bottom:8px"><span>مصروفات</span><span>'+periodExpenses+' ج.م</span></div>' +
      '<div style="display:flex;justify-content:space-between;font-size:14px;font-weight:700;padding-top:8px;border-top:1px solid rgba(255,255,255,0.12)"><span style="color:#fff">صافي الفترة</span><span style="color:'+(periodNet>=0?"#7CD992":"#F0A0A0")+'">'+periodNet+' ج.م</span></div>' +
    '</div>' : '') +
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px">'+statsHtml+'</div>' +
    '<div class="card" style="margin-bottom:16px">' +
      '<div style="font-weight:700;color:var(--navy);font-size:14px;margin-bottom:10px">أكتر الأصناف تأجيراً'+(hasRange?" في الفترة دي":"")+'</div>' +
      topRentedHtml +
    '</div>' +
    '<div class="card" style="margin-bottom:16px">' +
      '<div style="font-weight:700;color:var(--navy);font-size:14px;margin-bottom:10px">أصناف محتاجة تجديد مخزون</div>' +
      lowStockHtml +
    '</div>' +
    '<div class="card">' +
      '<div style="font-weight:700;color:var(--navy);font-size:14px;margin-bottom:10px">التقرير الشهري</div>' +
      monthlyHtml +
    '</div>';
}
function renderReports(){
  if (!state.invLoaded || !state.custLoaded || !state.rentalsLoaded || !state.salesLoaded || !state.tailorLoaded){
    return pageHeader("report","التقارير","ملخص شامل لنشاط المحل") +
      '<div class="empty">'+icon("cloud",30,"var(--line)")+'<div style="margin-top:10px;font-size:14px">جاري تحميل البيانات من السحابة...</div></div>';
  }
  return pageHeader("report","التقارير","ملخص شامل لنشاط المحل") +
    '<div id="reportsContent">' + reportsContentHtml() + '</div>';
}

/* =========================================================
   Modal shell
   ========================================================= */
function openModal(modal){ state.modal = modal; renderModalInto(); }
function closeModal(){ state.modal = null; const host = document.getElementById("modalHost"); if (host) host.innerHTML = ""; }

function modalShellHtml(title, bodyHtml){
  return '<div class="modal-backdrop" id="modalBackdrop">' +
    '<div class="modal-sheet" id="modalSheet">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">' +
        '<h2 style="font-size:16.5px;color:var(--navy);font-weight:700">'+esc(title)+'</h2>' +
        '<button class="btn-icon" id="modalClose">'+icon("x",17,"var(--ink-soft)")+'</button>' +
      '</div>' + bodyHtml +
    '</div></div>';
}
function confirmHtml(text){
  return '<div class="confirm-backdrop" id="confirmBackdrop"><div class="confirm-box">' +
    '<div style="margin-bottom:10px">'+icon("warn",28,"var(--red)")+'</div>' +
    '<div style="font-size:14.5px;color:var(--ink);margin-bottom:18px">'+esc(text)+'</div>' +
    '<div style="display:flex;gap:10px">' +
      '<button class="btn-secondary" id="confirmCancel">إلغاء</button>' +
      '<button class="btn-danger" id="confirmYes">حذف</button>' +
    '</div></div></div>';
}

function renderModalInto(){
  let host = document.getElementById("modalHost");
  if (!host){
    host = document.createElement("div");
    host.id = "modalHost";
    document.body.appendChild(host);
  }
  const m = state.modal;
  if (!m){ host.innerHTML = ""; return; }

  if (m.type === "item") host.innerHTML = renderItemModal(m.data);
  else if (m.type === "bulkItem") host.innerHTML = renderBulkItemModal();
  else if (m.type === "customer") host.innerHTML = renderCustomerModal(m.data);
  else if (m.type === "rental") host.innerHTML = renderRentalModal(m.data);
  else if (m.type === "sale") host.innerHTML = renderSaleModal(m.data);
  else if (m.type === "tailor") host.innerHTML = renderTailorModal(m.data);
  else if (m.type === "supplier") host.innerHTML = renderSupplierModal(m.data);
  else if (m.type === "account") host.innerHTML = renderAccountModal(m.data);
  else if (m.type === "expense") host.innerHTML = renderExpenseModal(m.data);
  else if (m.type === "package") host.innerHTML = renderPackageModal(m.data);
  else if (m.type === "users") host.innerHTML = renderUsersModal();
  else if (m.type === "confirmDeleteItem") host.innerHTML = confirmHtml("هل تريد حذف هذا الصنف من المخزون؟");
  else if (m.type === "confirmDeleteCust") host.innerHTML = confirmHtml("هل تريد حذف بيانات هذا العميل؟");
  else if (m.type === "confirmDeleteRental") host.innerHTML = confirmHtml("هل تريد حذف عملية الإيجار دي؟");
  else if (m.type === "confirmDeleteSale") host.innerHTML = confirmHtml("هل تريد حذف عملية البيع دي؟");

/* ---- rental modal ---- */
function inventoryPickerOptions(selectedId){
  let opts = '<option value=""'+(!selectedId?" selected":"")+'>-- اختار من المخزون (اختياري) --</option>';
  const sorted = state.inventory.slice().sort((a,b) => {
    const ta = (a.type||""), tb = (b.type||"");
    if (ta !== tb) return ta < tb ? -1 : 1;
    const ca = (a.color||""), cb = (b.color||"");
    if (ca !== cb) return ca < cb ? -1 : 1;
    const sa = (a.size||""), sb = (b.size||"");
    return sa < sb ? -1 : (sa > sb ? 1 : 0);
  });
  sorted.forEach(it => {
    const avail = availableQtyOf(it);
    const label = (it.type||"") + (it.name?" - "+it.name:"") + (it.size?" - مقاس "+it.size:"") + (it.color?" - "+it.color:"") + " (متاح "+avail+")";
    opts += '<option value="'+esc(it.id)+'"'+(selectedId===it.id?" selected":"")+(avail<=0 && selectedId!==it.id?" disabled":"")+'>'+esc(label)+'</option>';
  });
  return opts;
}

    btn.addEventListener("click", () => { state.view = btn.getAttribute("data-view"); state.mobileOpen = false; render(); });
  });

  document.querySelectorAll("[data-view]").forEach(el => {
    if (el.classList.contains("navitem")) return;
    el.addEventListener("click", () => { state.view = el.getAttribute("data-view"); render(); });
  });

  if (state.view === "inventory") bindInventoryEvents();
  if (state.view === "customers") bindCustomersEvents();

  if (state.view === "sales") bindSalesEvents();

/* ---- modal events ---- */
function bindModalEvents(){
  const backdrop = document.getElementById("modalBackdrop");
  if (backdrop){
    backdrop.addEventListener("click", (e) => { if (e.target === backdrop){ closeModal(); } });
    const closeBtn = document.getElementById("modalClose");
    if (closeBtn) closeBtn.addEventListener("click", () => closeModal());
  }
  const confirmBackdrop = document.getElementById("confirmBackdrop");
  if (confirmBackdrop){
    confirmBackdrop.addEventListener("click", (e) => { if (e.target === confirmBackdrop){ closeModal(); } });
  }

  // quick-select chips (size/color presets in item modal)
  function bindChips(root){
    (root || document).querySelectorAll(".chip").forEach(function(btn){
      btn.addEventListener("click", function(){
        const target = document.getElementById(btn.getAttribute("data-fill"));
        if (target) target.value = btn.getAttribute("data-val");
      });
    });
  }
  bindChips();
  const typeInput = document.getElementById("m_type");
  if (typeInput) typeInput.addEventListener("input", function(){
    const preset = detectSizePreset(typeInput.value);
    const box = document.getElementById("sizeChips");
    if (box){
      box.innerHTML = preset ? chipsHtml(preset, "m_size") : "";
      bindChips(box);
    }
  });

  // bulk add modal — each selected color gets its own sizes, each size its own quantity
  if (document.getElementById("bm_save")){
    function bmRefreshPreview(){
      let items = 0, totalQty = 0;
      bulkAdd.selectedColors.forEach(function(color){
        const qtyMap = bulkAdd.colorQty[color] || {};
        Object.keys(qtyMap).forEach(function(size){
          items += 1;
          totalQty += Number(qtyMap[size]) || 0;
        });
      });
      const box = document.getElementById("bm_preview");
      if (items === 0){
        box.textContent = "اختار لون وحدد مقاساته وكمية كل مقاس وهيبان هنا عدد الأصناف اللي هتتضاف";
      } else {
        box.innerHTML = "هيتضاف <b>"+items+"</b> صنف — إجمالي القطع: <b>"+totalQty+"</b>";
      }
    }

    function bmCardInnerHtml(color, sizeOptions){
      const sizesSet = bulkAdd.colorSizes[color] || new Set();
      const qtyMap = bulkAdd.colorQty[color] || {};
      const chipsRow = '<div class="label" style="margin-bottom:6px">مقاسات متاحة من اللون ده</div>' +
        '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px">' +
          sizeOptions.map(function(s){ return toggleChipHtml(s, "size", sizesSet.has(s)); }).join("") +
        '</div>';
      const orderedSizes = sizeOptions.filter(function(s){ return sizesSet.has(s); });
      const qtyRows = orderedSizes.length === 0 ?
        '<div style="font-size:12px;color:var(--ink-soft)">اختار مقاس فوق الأول عشان تحدد كميته</div>' :
        '<div class="label" style="margin-bottom:6px">الكمية لكل مقاس</div>' +
        orderedSizes.map(function(s){
          const q = qtyMap[s] || 1;
          return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">' +
            '<span style="min-width:54px;font-size:13px;font-weight:700;color:var(--navy);background:var(--cream);border-radius:8px;padding:6px 8px;text-align:center">'+esc(s)+'</span>' +
            '<input class="input bm-size-qty" data-size="'+esc(s)+'" type="number" min="1" value="'+q+'" style="flex:1"/>' +
          '</div>';
        }).join("");
      return chipsRow + qtyRows;
    }

    function bmBindCardEvents(cardEl){
      const color = cardEl.getAttribute("data-color");
      cardEl.querySelectorAll(".chip-toggle").forEach(function(btn){
        btn.addEventListener("click", function(){
          const val = btn.getAttribute("data-val");
          const set = bulkAdd.colorSizes[color];
          const nowSelected = btn.getAttribute("data-selected") === "1";
          if (nowSelected){ set.delete(val); delete bulkAdd.colorQty[color][val]; }
          else { set.add(val); bulkAdd.colorQty[color][val] = bulkAdd.colorQty[color][val] || 1; }
          const typeVal = document.getElementById("bm_type").value;
          const inner = cardEl.querySelector(".bm-card-inner");
          inner.innerHTML = bmCardInnerHtml(color, bulkSizeOptions(typeVal));
          bmBindCardEvents(cardEl);
          bmRefreshPreview();
        });
      });
      cardEl.querySelectorAll(".bm-size-qty").forEach(function(inp){
        inp.addEventListener("input", function(){
          bulkAdd.colorQty[color][inp.getAttribute("data-size")] = Number(inp.value) || 1;
          bmRefreshPreview();
        });
      });
    }

    function bmRenderColorCards(){
      const typeVal = document.getElementById("bm_type").value;
      const sizeOptions = bulkSizeOptions(typeVal);
      const box = document.getElementById("bm_colorCards");
      if (bulkAdd.selectedColors.length === 0){
        box.innerHTML = '<div style="font-size:12.5px;color:var(--ink-soft);text-align:center;padding:16px;border:1px dashed var(--line);border-radius:10px">اختار لون فوق الأول عشان تحدد مقاساته وكمياته</div>';
        return;
      }
      box.innerHTML = bulkAdd.selectedColors.map(function(color){
        return '<div class="card" data-color="'+esc(color)+'" style="padding:14px">' +
          '<div style="font-weight:700;color:var(--navy);font-size:14px;margin-bottom:10px">'+esc(color)+'</div>' +
          '<div class="bm-card-inner">' + bmCardInnerHtml(color, sizeOptions) + '</div>' +
        '</div>';
      }).join("");
      box.querySelectorAll(".card[data-color]").forEach(bmBindCardEvents);
    }

    function bmRenderColorChips(){
      const box = document.getElementById("bm_colorChips");
      box.innerHTML = bulkColorPool().map(function(c){

    const errEl = document.getElementById("nu_err");
    if (!name){ errEl.textContent = "اكتب اسم المستخدم"; errEl.style.display = "block"; return; }
    if (state.usersCache.some(u => u.username.trim().toLowerCase() === name.toLowerCase())){ errEl.textContent = "اسم المستخدم ده مستخدم قبل كده"; errEl.style.display = "block"; return; }
    if (pin.length < 4){ errEl.textContent = "كلمة السر لازم 4 أرقام على الأقل"; errEl.style.display = "block"; return; }
    const permissions = {};
    document.querySelectorAll(".nu-perm").forEach(cb => { permissions[cb.getAttribute("data-key")] = cb.checked; });
    nuAdd.disabled = true; nuAdd.textContent = "جاري الإضافة...";
    try {
      const newId = uid();
      const arr = await fsGetList("users");
      arr.push({ id:newId, username:name, pin:pin, role:"staff", permissions:permissions });
      await fsSaveList("users", arr);
    } catch(e){}
    await refreshUsersCache();
    state.modal = { type:"users" };
    renderModalInto();
  });
  document.querySelectorAll("[data-del-user]").forEach(btn => {
    btn.addEventListener("click", () => { openModal({ type:"confirmDeleteUser", id: btn.getAttribute("data-del-user") }); });
  });
  document.querySelectorAll("[data-toggle-perms]").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.getAttribute("data-toggle-perms");
      const current = state.modal.editUserId;
      state.modal = { type:"users", editUserId: current === id ? null : id };
      renderModalInto();
    });
  });
  document.querySelectorAll("[data-cancel-perms]").forEach(btn => {
    btn.addEventListener("click", () => { state.modal = { type:"users" }; renderModalInto(); });
  });
  document.querySelectorAll("[data-save-perms]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const id = btn.getAttribute("data-save-perms");
      const permissions = {};
      document.querySelectorAll(".eu-perm").forEach(cb => { permissions[cb.getAttribute("data-key")] = cb.checked; });
      btn.disabled = true; btn.textContent = "جاري الحفظ...";
      try {
        const arr = await fsGetList("users");
        const idx = arr.findIndex(u => u.id === id);
        if (idx >= 0) arr[idx].permissions = permissions;
        await fsSaveList("users", arr);
        await refreshUsersCache();
        const me = state.usersCache.find(u => u.username === state.username);
        if (me && me.id === id) state.userPermissions = userPermissions(me);
      } catch(e){}
      state.modal = { type:"users" };
      renderModalInto();
    });
  });
}

function bindShellDashboardClicks(){
  document.querySelectorAll("[data-view]").forEach(el => {
    el.addEventListener("click", () => { state.view = el.getAttribute("data-view"); render(); });
  });
}

/* =========================================================
   boot
   ========================================================= */
window.addEventListener("online", () => { state.online = true; renderSyncBadge(); });
window.addEventListener("offline", () => { state.online = false; renderSyncBadge(); });
boot();
</script>
