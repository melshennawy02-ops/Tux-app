<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>TUX - نظام إدارة المحل (سحابي)</title>
<style>
  :root{
    --navy:#0B0B0C; --navy-mid:#161616; --navy-light:#242422;
    --gold:#C9A227; --gold-soft:#E8CD73;
    --cream:#F6F2E7; --paper:#FDFCF8;
    --ink:#20242B; --ink-soft:#5B5F68; --line:#E6E0CE;
    --green:#4C7A5A; --green-bg:#EAF2EC;
    --amber:#B8860B; --amber-bg:#FBF3E1;
    --red:#A63D40; --red-bg:#FBEBEC;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--cream);
    font-family:-apple-system,'Segoe UI',Tahoma,Arial,'Noto Sans Arabic',sans-serif; color:var(--ink); }
  input,select,textarea,button{ font-family:inherit; font-size:15px; }
  button{ cursor:pointer; }
  h1,h2,p{ margin:0; }
  .icon{ display:inline-block; vertical-align:middle; line-height:0; }
  .icon svg{ display:block; }

  .input{ width:100%; box-sizing:border-box; padding:11px 14px; border-radius:10px;
    border:1px solid var(--line); font-size:15px; background:#fff; color:var(--ink); outline:none; }
  .label{ display:block; font-size:13px; color:var(--ink-soft); margin-bottom:6px; font-weight:500; }
  .btn-primary{ width:100%; padding:12px 14px; border-radius:10px; border:none;
    background:var(--navy); color:var(--gold-soft); font-size:15px; font-weight:700; }
  .btn-primary:disabled{ opacity:0.55; }
  .btn-secondary{ width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line);
    background:#fff; color:var(--ink); font-size:15px; font-weight:600; }
  .btn-danger{ width:100%; padding:12px 14px; border-radius:10px; border:none;
    background:var(--red); color:#fff; font-size:15px; font-weight:700; }
  .btn-add{ display:flex; align-items:center; gap:6px; padding:9px 14px; border-radius:10px;
    border:none; background:var(--navy); color:var(--gold-soft); font-size:13.5px; font-weight:600; flex-shrink:0; }
  .btn-icon{ width:32px; height:32px; border-radius:8px; border:1px solid var(--line);
    background:#fff; display:flex; align-items:center; justify-content:center; }
  .err{ color:var(--red); font-size:13px; margin-bottom:12px; text-align:center; }
  .field{ margin-bottom:14px; }

  .tape{ width:100%; height:14px; display:block; margin:14px 0; }

  .sidebar{ position:sticky; top:0; height:100vh; width:240px; background:var(--navy);
    z-index:50; display:flex; flex-direction:column; flex-shrink:0; }
  .sidebar-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:40; display:none; }
  .navitem{ width:100%; display:flex; align-items:center; gap:10px; padding:10px 12px;
    margin-bottom:3px; border-radius:9px; border:none; background:transparent;
    color:rgba(255,255,255,0.75); font-size:14px; cursor:pointer; text-align:right; }
  .navitem.active{ background:var(--navy-light); color:var(--gold-soft); font-weight:600; }
  .navitem .soon{ font-size:9.5px; color:rgba(255,255,255,0.35); border:1px solid rgba(255,255,255,0.2);
    border-radius:20px; padding:1px 6px; margin-right:auto; }
  .sidebar-foot-btn{ width:100%; display:flex; align-items:center; justify-content:center; gap:8px;
    padding:10px 12px; border-radius:9px; border:1px solid rgba(255,255,255,0.15);
    background:transparent; color:rgba(255,255,255,0.65); font-size:13px; }

  .main{ flex:1; min-width:0; }
  .topbar{ display:none; align-items:center; gap:10px; padding:14px 16px; background:var(--navy); }
  .content{ max-width:760px; margin:0 auto; padding:24px 18px 60px; }

  .card{ background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .row{ display:flex; align-items:center; gap:12px; }
  .badge{ font-size:11px; padding:2px 8px; border-radius:20px; font-weight:600; }
  .empty{ text-align:center; padding:50px 20px; color:var(--ink-soft); }

  .modal-backdrop{ position:fixed; inset:0; background:rgba(19,28,49,0.55); z-index:100;
    display:flex; align-items:flex-end; justify-content:center; }
  .modal-sheet{ width:100%; max-width:460px; background:var(--paper); border-radius:18px 18px 0 0;
    padding:20px 20px 26px; max-height:88vh; overflow-y:auto; }
  .confirm-backdrop{ position:fixed; inset:0; background:rgba(19,28,49,0.55); z-index:110;
    display:flex; align-items:center; justify-content:center; padding:24px; }
  .confirm-box{ background:var(--paper); border-radius:14px; padding:22px; max-width:320px;
    width:100%; text-align:center; }

  .auth-wrap{ min-height:100vh; background:linear-gradient(180deg,var(--navy) 0%,var(--navy-mid) 100%);
    display:flex; align-items:center; justify-content:center; padding:24px; }
  .auth-card{ width:100%; max-width:380px; background:var(--paper); border-radius:16px;
    padding:32px 28px; box-shadow:0 20px 60px rgba(0,0,0,0.35); }

  .sync-badge{ position:fixed; bottom:10px; left:10px; z-index:999; font-size:10.5px;
    color:#8a8a80; background:rgba(255,255,255,0.9); padding:3px 9px; border-radius:20px;
    border:1px solid #e6e0ce; display:flex; align-items:center; gap:5px; }
  .sync-dot{ width:6px; height:6px; border-radius:50%; background:var(--green); flex-shrink:0; }
  .sync-dot.off{ background:var(--red); }

  @media (max-width: 780px){
    .sidebar{ position:fixed !important; top:0; right:-260px; transition:right .25s ease; }
    .sidebar.open{ right:0 !important; }
    .sidebar-overlay.show{ display:block; }
    .topbar{ display:flex !important; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";

/* =========================================================
   Firestore over plain REST (no streaming/websocket layer —
   works on restrictive mobile networks that block long-lived connections)
   ========================================================= */
const PROJECT_ID = "tux-stores";
const API_KEY = "AIzaSyD5nDjqJqNYwx99yciBzsL1527w3Z5XYis";
const FS_BASE = "https://firestore.googleapis.com/v1/projects/" + PROJECT_ID + "/databases/(default)/documents";

function fsEncodeValue(v){
  if (typeof v === "number") {
    return Number.isInteger(v) ? { integerValue: String(v) } : { doubleValue: v };
  }
  return { stringValue: v == null ? "" : String(v) };
}
function fsEncodeFields(obj){
  const fields = {};
  for (const k in obj) fields[k] = fsEncodeValue(obj[k]);
  return { fields: fields };
}
function fsDecodeValue(v){
  if (!v) return "";
  if ("stringValue" in v) return v.stringValue;
  if ("integerValue" in v) return Number(v.integerValue);
  if ("doubleValue" in v) return Number(v.doubleValue);
  if ("booleanValue" in v) return v.booleanValue;
  return "";
}
function fsDecodeDoc(doc){
  const obj = {};
  const fields = doc.fields || {};
  for (const k in fields) obj[k] = fsDecodeValue(fields[k]);
  return obj;
}
async function fsGetDoc(collection, id){
  const res = await fetch(FS_BASE + "/" + collection + "/" + id + "?key=" + API_KEY);
  if (res.status === 404) return null;
  if (!res.ok) throw new Error("fs get " + res.status);
  return fsDecodeDoc(await res.json());
}
async function fsSetDoc(collection, id, data){
  const res = await fetch(FS_BASE + "/" + collection + "/" + id + "?key=" + API_KEY, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(fsEncodeFields(data)),
  });
  if (!res.ok) {
    let detail = "";
    try { detail = (await res.json()).error.message; } catch(e2){}
    throw new Error("fs set " + res.status + (detail ? " - " + detail : ""));
  }
}
async function fsDeleteDoc(collection, id){
  const res = await fetch(FS_BASE + "/" + collection + "/" + id + "?key=" + API_KEY, { method: "DELETE" });
  if (!res.ok && res.status !== 404) throw new Error("fs delete " + res.status);
}
async function fsList(collection){
  const res = await fetch(FS_BASE + "/" + collection + "?key=" + API_KEY + "&pageSize=300");
  if (!res.ok) throw new Error("fs list " + res.status);
  const data = await res.json();
  const docs = data.documents || [];
  return docs.map(function (d) {
    const id = d.name.split("/").pop();
    const obj = fsDecodeDoc(d);
    obj.id = obj.id || id;
    return obj;
  });
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

  ruler:'<path d="M3 16 16 3l5 5L8 21z"/><path d="m9 12 2 2M12 9l2 2M15 6l2 2"/>',
  note:'<path d="M5 3h11l3 3v15H5z"/><path d="M8 9h8M8 13h8M8 17h5"/>',
  warn:'<path d="M12 3 2 20h20Z"/><path d="M12 9v5M12 17h.01"/>',
  check:'<path d="M4 12l5 5L20 6"/>',
  user:'<circle cx="12" cy="8" r="3.6"/><path d="M5 20c1.3-4.2 4-6.2 7-6.2S18.7 15.8 20 20"/>',
  cloud:'<path d="M7 18a4 4 0 0 1-.5-7.97A5.5 5.5 0 0 1 17 9a4 4 0 0 1 1 7.9"/><path d="M7 18h10"/>',
};
function icon(name, size, color){
  size = size || 18; color = color || "currentColor";
  const body = ICONS[name] || "";
  return '<span class="icon" style="width:'+size+'px;height:'+size+'px;color:'+color+'">' +
    '<svg viewBox="0 0 24 24" width="'+size+'" height="'+size+'" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+body+'</svg></span>';
}
function tapeRule(color){
  color = color || "var(--gold)";
  let ticks = "";
  for (let i=0;i<60;i++){
    const x = (i/60*100).toFixed(2)+"%";
    const y1 = i%5===0 ? 2 : 5, y2 = i%5===0 ? 12 : 9;
    const op = i%5===0 ? 0.55 : 0.3;
    ticks += '<line x1="'+x+'" x2="'+x+'" y1="'+y1+'" y2="'+y2+'" stroke="'+color+'" stroke-width="1" opacity="'+op+'"/>';
  }
  return '<svg class="tape" preserveAspectRatio="none"><line x1="0" y1="7" x2="100%" y2="7" stroke="'+color+'" stroke-width="1" opacity="0.4"/>'+ticks+'</svg>';
}

/* =========================================================
   boot: check if a shop already exists in the cloud
   ========================================================= */
async function boot(){
  document.getElementById("app").innerHTML = '<div class="auth-wrap"><div style="color:rgba(255,255,255,0.7);text-align:center">' + icon("cloud",30,"var(--gold)") + '<div style="margin-top:10px">جاري الاتصال بالسحابة...</div></div></div>';
  try {
    const shop = await fsGetDoc("config", "shop");
    if (shop){
      state.bootPhase = "login";
      state.shopName = shop.shopName || "";
    } else {
      state.bootPhase = "setup";
    }
    state.online = true;
  } catch (e){
    state.bootPhase = "error";
    state.online = false;
    state.lastError = (e && e.message) ? e.message : String(e);
  }
  render();
}

  }

  return '' +

    '</div>' +
    tapeRule() +
    '<form id="authForm" style="margin-top:10px">' +
      (isSetup ? '<div class="field"><label class="label">اسم المحل</label><input class="input" id="f_shop" placeholder="مثال: TUX - Men\'s wear"/></div>' : '') +
      '<div class="field"><label class="label">'+(isSetup ? "اسم المستخدم (هيكون أول حساب أدمن)" : "اسم المستخدم")+'</label><input class="input" id="f_user" placeholder="مثال: محمد"/></div>' +
      '<div class="field"><label class="label">'+(isSetup ? "اختار كلمة سر" : "كلمة السر")+'</label><input class="input" id="f_pin" type="password" inputmode="numeric" placeholder="****"/></div>' +
      (isSetup ? '<div class="field"><label class="label">تأكيد كلمة السر</label><input class="input" id="f_pin2" type="password" inputmode="numeric" placeholder="****"/></div>' : '') +
      '<div id="authErr" class="err" style="display:none"></div>' +
      '<button type="submit" class="btn-primary" id="authSubmit">'+(isSetup ? "إنشاء الحساب والدخول" : "دخول")+'</button>' +
    '</form>' +
    (!isSetup ? '<p style="text-align:center;font-size:11.5px;color:var(--ink-soft);margin-top:14px">'+esc(state.shopName)+'</p>' : '') +
  '</div></div>';
}

function bindAuthEvents(){
  const retry = document.getElementById("retryBoot");
  if (retry){ retry.addEventListener("click", boot); return; }

  const form = document.getElementById("authForm");
  const isSetup = state.bootPhase === "setup";
  form.addEventListener("submit", async function(e){
    e.preventDefault();
    const errEl = document.getElementById("authErr");
    const submitBtn = document.getElementById("authSubmit");
    function showErr(msg){ errEl.textContent = msg; errEl.style.display = "block"; }
    const username = document.getElementById("f_user").value.trim();
    const pin = document.getElementById("f_pin").value;

    if (isSetup){
      const shopName = document.getElementById("f_shop").value.trim();
      const pin2 = document.getElementById("f_pin2").value;
      if (!shopName) return showErr("اكتب اسم المحل");
      if (!username) return showErr("اختار اسم مستخدم");
      if (pin.length < 4) return showErr("كلمة السر لازم 4 أرقام على الأقل");
      if (pin !== pin2) return showErr("كلمة السر مش متطابقة");
      submitBtn.disabled = true; submitBtn.textContent = "جاري الإنشاء...";
      try {
        const firstUser = { id:uid(), username:username, pin:pin, role:"admin" };
        await fsSetDoc("config", "shop", { shopName:shopName });
        await fsSetDoc("users", firstUser.id, firstUser);
        state.shopName = shopName; state.username = username; state.authed = true;
        afterLogin();
      } catch(err){
        submitBtn.disabled = false; submitBtn.textContent = "إنشاء الحساب والدخول";
        showErr("خطأ: " + (err && err.message ? err.message : err));
      }
    } else {
      if (!username) return showErr("اكتب اسم المستخدم");
      submitBtn.disabled = true; submitBtn.textContent = "جاري الدخول...";
      try {
        const users = await fsList("users");
        const match = users.find(u => u.username.trim().toLowerCase() === username.toLowerCase() && u.pin === pin);
        if (match){
          state.username = match.username; state.authed = true;
          afterLogin();
        } else {
          submitBtn.disabled = false; submitBtn.textContent = "دخول";
          showErr("اسم المستخدم أو كلمة السر غلط");
        }
      } catch(err){
        submitBtn.disabled = false; submitBtn.textContent = "دخول";
        showErr("خطأ: " + (err && err.message ? err.message : err));
      }
    }
  });
}

function afterLogin(){
  state.view = "dashboard";
  render();
  subscribeData();
}

/* =========================================================
   cloud sync via polling (plain REST calls, no persistent
   connection — refreshes every few seconds)
   ========================================================= */
let pollTimer = null;
function subscribeData(){
  pollOnce();
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(pollOnce, 4000);
}
async function pollOnce(){
  try {
    const [inv, cust] = await Promise.all([fsList("inventory"), fsList("customers")]);
    inv.sort((a,b) => (b._ts||0) - (a._ts||0));
    cust.sort((a,b) => (b._ts||0) - (a._ts||0));
    state.inventory = inv;
    state.customers = cust;
    state.invLoaded = true;
    state.custLoaded = true;
    state.online = true;
    onDataChanged();
  } catch (e){
    state.online = false;
    renderSyncBadge();
  }
}

function onDataChanged(){
  renderSyncBadge();
  if (!state.authed) return;
  if (state.view === "inventory" && document.getElementById("invList")) refreshInventoryList();
  if (state.view === "customers" && document.getElementById("custList")) refreshCustomersList();
  if (state.view === "dashboard" && document.getElementById("mainContent")){
    document.getElementById("mainContent").innerHTML = renderDashboard();
    bindShellDashboardClicks();
  }
}

/* =========================================================
   Inventory
   ========================================================= */
function filteredInventory(){
  const q = state.invQuery.toLowerCase();
  return state.inventory.filter(it => {
    const matchQ = !q || it.name.toLowerCase().includes(q) || it.color.toLowerCase().includes(q) || it.size.toLowerCase().includes(q);
    const matchType = state.invType === "الكل" || it.type === state.invType;
    return matchQ && matchType;
  });
}

function inventoryListHtml(){
  const list = filteredInventory();

        '<span style="position:absolute;right:12px;top:12px">'+icon("search",15,"var(--ink-soft)")+'</span>'+
        '<input class="input" style="padding-right:36px" id="invSearch" placeholder="ابحث بالاسم أو اللون أو المقاس" value="'+esc(state.invQuery)+'"/></div>' +
      '<select class="input" style="width:auto;flex:0 0 auto" id="invTypeFilter">'+typeOptions+'</select>' +
    '</div>' +
    '<div id="invList">' + inventoryListHtml() + '</div>';
}

/* =========================================================
   Customers
   ========================================================= */
function filteredCustomers(){
  const q = state.custQuery.toLowerCase();
  return state.customers.filter(c => !q || c.name.toLowerCase().includes(q) || c.phone.includes(state.custQuery));
}

function customersListHtml(){
  const list = filteredCustomers();
  if (!state.custLoaded){
    return '<div class="empty">'+icon("cloud",30,"var(--line)")+'<div style="margin-top:10px;font-size:14px">جاري التحميل من السحابة...</div></div>';
  }
  if (list.length === 0){
    return '<div class="empty">'+icon("users",34,"var(--line)")+'<div style="margin-top:10px;font-size:14px">'+
      (state.customers.length===0 ? "لسه مفيش عملاء — ابدأ بإضافة أول عميل" : "مفيش نتائج مطابقة")+'</div></div>';
  }
  return '<div style="display:flex;flex-direction:column;gap:10px">' + list.map(c => {
    const isOpen = state.expandedCustomer === c.id;
    const extra = (isOpen && (c.measurements || c.notes)) ? (
      '<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line)">' +
      (c.measurements ? '<div style="font-size:13px;color:var(--ink);display:flex;gap:6px;margin-bottom:6px">'+icon("ruler",14,"var(--gold)")+'<span>'+esc(c.measurements)+'</span></div>' : '') +
      (c.notes ? '<div style="font-size:13px;color:var(--ink-soft);display:flex;gap:6px">'+icon("note",14,"var(--gold)")+'<span>'+esc(c.notes)+'</span></div>' : '') +
      '</div>') : '';
    return '<div class="card">' +
      '<div class="row" style="cursor:pointer" data-toggle-cust="'+c.id+'">' +
        '<div style="width:38px;height:38px;border-radius:50%;background:var(--navy);color:var(--gold-soft);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0">'+esc(c.name ? c.name.trim()[0] : "?")+'</div>' +
        '<div style="flex:1;min-width:0">' +
          '<div style="font-weight:600;color:var(--navy);font-size:14.5px">'+esc(c.name||"بدون اسم")+'</div>' +
          (c.phone ? '<div style="font-size:12.5px;color:var(--ink-soft);display:flex;align-items:center;gap:4px;margin-top:2px">'+icon("phone",11)+' '+esc(c.phone)+'</div>' : '') +
        '</div>' +
        '<div style="display:flex;gap:6px" data-stop="1">' +
          '<button class="btn-icon" data-edit-cust="'+c.id+'">'+icon("pencil",15,"var(--navy)")+'</button>' +
          '<button class="btn-icon" data-del-cust="'+c.id+'">'+icon("trash",15,"var(--red)")+'</button>' +
        '</div>' +
      '</div>' + extra +
    '</div>';
  }).join("") + '</div>';
}

function renderCustomers(){
  return pageHeader("users","العملاء", state.customers.length+" عميل مسجل",
      '<button class="btn-add" id="btnAddCust">'+icon("plus",16)+' إضافة عميل</button>') +
    '<div style="position:relative;margin-bottom:16px">' +
      '<span style="position:absolute;right:12px;top:12px">'+icon("search",15,"var(--ink-soft)")+'</span>' +
      '<input class="input" style="padding-right:36px" id="custSearch" placeholder="ابحث بالاسم أو رقم التليفون" value="'+esc(state.custQuery)+'"/></div>' +
    '<div id="custList">' + customersListHtml() + '</div>';
}

/* =========================================================
   Modal shell
   ========================================================= */
function openModal(modal){ state.modal = modal; renderModalInto(); }
function closeModal(){ state.modal = null; const host = document.getElementById("modalHost"); if (host) host.innerHTML = ""; }

function modalShellHtml(title, bodyHtml){
  return '<div class="modal-backdrop" id="modalBackdrop">' +
    '<div class="modal-sheet" id="modalSheet">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">' +
        '<h2 style="font-size:16.5px;color:var(--navy);font-weight:700">'+esc(title)+'</h2>' +
        '<button class="btn-icon" id="modalClose">'+icon("x",17,"var(--ink-soft)")+'</button>' +
      '</div>' + bodyHtml +
    '</div></div>';
}
function confirmHtml(text){
  return '<div class="confirm-backdrop" id="confirmBackdrop"><div class="confirm-box">' +
    '<div style="margin-bottom:10px">'+icon("warn",28,"var(--red)")+'</div>' +
    '<div style="font-size:14.5px;color:var(--ink);margin-bottom:18px">'+esc(text)+'</div>' +
    '<div style="display:flex;gap:10px">' +
      '<button class="btn-secondary" id="confirmCancel">إلغاء</button>' +
      '<button class="btn-danger" id="confirmYes">حذف</button>' +
    '</div></div></div>';
}

function renderModalInto(){
  let host = document.getElementById("modalHost");
  if (!host){
    host = document.createElement("div");
    host.id = "modalHost";
    document.body.appendChild(host);
  }
  const m = state.modal;
  if (!m){ host.innerHTML = ""; return; }

  if (m.type === "item") host.innerHTML = renderItemModal(m.data);
  else if (m.type === "customer") host.innerHTML = renderCustomerModal(m.data);
  else if (m.type === "users") host.innerHTML = renderUsersModal();
  else if (m.type === "confirmDeleteItem") host.innerHTML = confirmHtml("هل تريد حذف هذا الصنف من المخزون؟");
  else if (m.type === "confirmDeleteCust") host.innerHTML = confirmHtml("هل تريد حذف بيانات هذا العميل؟");
  else if (m.type === "confirmDeleteUser") host.innerHTML = confirmHtml("هل تريد حذف هذا المستخدم؟");

  bindModalEvents();
}

/* ---- item modal ---- */
function renderItemModal(item){
  let typeOpts = ITEM_TYPES.map(t => '<option'+(item.type===t?" selected":"")+'>'+t+'</option>').join("");
  let statusOpts = STATUS_OPTIONS.map(s => '<option value="'+s.value+'"'+(item.status===s.value?" selected":"")+'>'+s.label+'</option>').join("");
  const body = '' +
    '<div style="display:flex;flex-direction:column;gap:12px">' +
      '<div><label class="label">نوع الصنف</label><select class="input" id="m_type">'+typeOpts+'</select></div>' +
      '<div><label class="label">اسم / وصف الصنف</label><input class="input" id="m_name" value="'+esc(item.name)+'" placeholder="مثال: بدلة كحلي كلاسيك"/></div>' +
      '<div style="display:flex;gap:10px">' +
        '<div style="flex:1"><label class="label">المقاس</label><input class="input" id="m_size" value="'+esc(item.size)+'" placeholder="50"/></div>' +
        '<div style="flex:1"><label class="label">اللون</label><input class="input" id="m_color" value="'+esc(item.color)+'" placeholder="كحلي"/></div>' +
      '</div>' +
      '<div style="display:flex;gap:10px">' +
        '<div style="flex:1"><label class="label">الكمية</label><input class="input" id="m_qty" type="number" min="0" value="'+esc(item.quantity)+'"/></div>' +
        '<div style="flex:1"><label class="label">السعر (اختياري)</label><input class="input" id="m_price" type="number" min="0" value="'+esc(item.price)+'" placeholder="ج.م"/></div>' +
      '</div>' +
      '<div><label class="label">الحالة</label><select class="input" id="m_status">'+statusOpts+'</select></div>' +
      '<div id="m_err" class="err" style="display:none"></div>' +
      '<button class="btn-primary" id="m_save">حفظ</button>' +
    '</div>';
  return modalShellHtml(item.name ? "تعديل الصنف" : "إضافة صنف جديد", body) + '<input type="hidden" id="m_id" value="'+item.id+'"/>';
}

/* ---- customer modal ---- */
function renderCustomerModal(c){
  const body = '' +
    '<div style="display:flex;flex-direction:column;gap:12px">' +
      '<div><label class="label">اسم العميل</label><input class="input" id="m_cname" value="'+esc(c.name)+'" placeholder="الاسم بالكامل"/></div>' +
      '<div><label class="label">رقم التليفون</label><input class="input" id="m_cphone" value="'+esc(c.phone)+'" placeholder="01xxxxxxxxx"/></div>' +
      '<div><label class="label">المقاسات</label><textarea class="input" id="m_cmeas" style="min-height:64px;resize:vertical" placeholder="مثال: الطول 175 - الصدر 102 - الخصر 88">'+esc(c.measurements)+'</textarea></div>' +
      '<div><label class="label">ملاحظات</label><textarea class="input" id="m_cnotes" style="min-height:56px;resize:vertical" placeholder="أي ملاحظات إضافية">'+esc(c.notes)+'</textarea></div>' +
      '<div id="m_cerr" class="err" style="display:none"></div>' +
      '<button class="btn-primary" id="m_csave">حفظ</button>' +
    '</div>';
  return modalShellHtml(c.name ? "تعديل بيانات العميل" : "إضافة عميل جديد", body) + '<input type="hidden" id="m_cid" value="'+c.id+'"/>';
}

/* ---- users modal ---- */
function renderUsersModal(){
  const users = state.usersCache;
  const showAdd = state.modal && state.modal.showAdd;
  let rows = users.map(u => {
    return '<div class="row" style="padding:10px 12px;border:1px solid var(--line);border-radius:10px">' +
      '<div style="width:32px;height:32px;border-radius:50%;background:var(--navy);color:var(--gold-soft);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0">'+esc(u.username[0])+'</div>' +
      '<div style="flex:1;min-width:0"><div style="font-size:13.5px;font-weight:600;color:var(--navy)">'+esc(u.username)+(u.username===state.username?" (أنت)":"")+'</div>' +
      '<div style="font-size:11.5px;color:var(--ink-soft)">'+(u.role==="admin"?"أدمن":"موظف")+'</div></div>' +
      (users.length>1 ? '<button class="btn-icon" data-del-user="'+u.id+'">'+icon("trash",14,"var(--red)")+'</button>' : '') +
    '</div>';
  }).join('<div style="height:10px"></div>');

  const addBlock = showAdd ? (
    '<div style="border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:12px">' +
      '<div class="field"><label class="label">اسم المستخدم الجديد</label><input class="input" id="nu_name"/></div>' +
      '<div class="field"><label class="label">كلمة السر</label><input class="input" id="nu_pin" type="password" inputmode="numeric"/></div>' +
      '<div id="nu_err" class="err" style="display:none"></div>' +
      '<div style="display:flex;gap:8px">' +
        '<button class="btn-secondary" id="nu_cancel">إلغاء</button>' +
        '<button class="btn-primary" id="nu_add">إضافة</button>' +
      '</div></div>'
  ) : '<button class="btn-add" id="nu_show" style="justify-content:center;width:100%;margin-top:12px">'+icon("plus",16)+' إضافة مستخدم جديد</button>';

  return modalShellHtml("إدارة المستخدمين", '<div>' + (rows || '<div style="color:var(--ink-soft);font-size:13px;text-align:center;padding:10px">جاري التحميل...</div>') + addBlock + '</div>');
}

async function openUsersModal(){
  openModal({ type:"users" });
  try {
    state.usersCache = await fsList("users");
  } catch(e){ state.usersCache = []; }
  if (state.modal && state.modal.type === "users") renderModalInto();
}
async function refreshUsersCache(){
  try {
    state.usersCache = await fsList("users");
  } catch(e){}
}

/* =========================================================
   event binding
   ========================================================= */
function bindShellEvents(){
  const overlay = document.getElementById("sbOverlay");
  if (overlay) overlay.addEventListener("click", () => { state.mobileOpen = false; render(); });
  const openBtn = document.getElementById("btnOpenSidebar");
  if (openBtn) openBtn.addEventListener("click", () => { state.mobileOpen = true; render(); });

  document.querySelectorAll(".navitem").forEach(btn => {
    btn.addEventListener("click", () => { state.view = btn.getAttribute("data-view"); state.mobileOpen = false; render(); });
  });
  document.getElementById("btnUsers").addEventListener("click", () => openUsersModal());
  document.getElementById("btnLogout").addEventListener("click", () => { state.authed = false; state.modal = null; boot(); });

  document.querySelectorAll("[data-view]").forEach(el => {
    if (el.classList.contains("navitem")) return;
    el.addEventListener("click", () => { state.view = el.getAttribute("data-view"); render(); });
  });

  if (state.view === "inventory") bindInventoryEvents();
  if (state.view === "customers") bindCustomersEvents();
}

function bindInventoryEvents(){
  const addBtn = document.getElementById("btnAddItem");
  if (addBtn) addBtn.addEventListener("click", () => openModal({ type:"item", data:{ id:uid(), type:ITEM_TYPES[0], name:"", size:"", color:"", quantity:1, price:"", status:"available" } }));

  const search = document.getElementById("invSearch");
  if (search) search.addEventListener("input", () => { state.invQuery = search.value; refreshInventoryList(); });
  const typeSel = document.getElementById("invTypeFilter");
  if (typeSel) typeSel.addEventListener("change", () => { state.invType = typeSel.value; refreshInventoryList(); });

  bindInventoryListEvents();
}
function refreshInventoryList(){
  const host = document.getElementById("invList");
  if (!host) return;
  host.innerHTML = inventoryListHtml();
  bindInventoryListEvents();
}
function bindInventoryListEvents(){
  document.querySelectorAll("[data-edit-item]").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.getAttribute("data-edit-item");
      const item = state.inventory.find(i => i.id === id);
      if (item) openModal({ type:"item", data: Object.assign({}, item) });
    });
  });
  document.querySelectorAll("[data-del-item]").forEach(btn => {
    btn.addEventListener("click", () => {
      openModal({ type:"confirmDeleteItem", id: btn.getAttribute("data-del-item") });
    });
  });
}

function bindCustomersEvents(){
  const addBtn = document.getElementById("btnAddCust");
  if (addBtn) addBtn.addEventListener("click", () => openModal({ type:"customer", data:{ id:uid(), name:"", phone:"", measurements:"", notes:"" } }));
  const search = document.getElementById("custSearch");
  if (search) search.addEventListener("input", () => { state.custQuery = search.value; refreshCustomersList(); });
  bindCustomersListEvents();
}
function refreshCustomersList(){
  const host = document.getElementById("custList");
  if (!host) return;
  host.innerHTML = customersListHtml();
  bindCustomersListEvents();
}
function bindCustomersListEvents(){
  document.querySelectorAll("[data-toggle-cust]").forEach(el => {
    el.addEventListener("click", (e) => {
      if (e.target.closest("[data-stop]")) return;
      const id = el.getAttribute("data-toggle-cust");
      state.expandedCustomer = state.expandedCustomer === id ? null : id;
      refreshCustomersList();
    });
  });
  document.querySelectorAll("[data-edit-cust]").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.getAttribute("data-edit-cust");
      const c = state.customers.find(x => x.id === id);
      if (c) openModal({ type:"customer", data: Object.assign({}, c) });
    });
  });
  document.querySelectorAll("[data-del-cust]").forEach(btn => {
    btn.addEventListener("click", () => {
      openModal({ type:"confirmDeleteCust", id: btn.getAttribute("data-del-cust") });
    });
  });
}

/* ---- modal events ---- */
function bindModalEvents(){
  const backdrop = document.getElementById("modalBackdrop");
  if (backdrop){
    backdrop.addEventListener("click", (e) => { if (e.target === backdrop){ closeModal(); } });
    const closeBtn = document.getElementById("modalClose");
    if (closeBtn) closeBtn.addEventListener("click", () => closeModal());
  }
  const confirmBackdrop = document.getElementById("confirmBackdrop");
  if (confirmBackdrop){
    confirmBackdrop.addEventListener("click", (e) => { if (e.target === confirmBackdrop){ closeModal(); } });
  }

  // item save
  const mSave = document.getElementById("m_save");
  if (mSave) mSave.addEventListener("click", async () => {
    const id = document.getElementById("m_id").value;
    const type = document.getElementById("m_type").value;
    const name = document.getElementById("m_name").value.trim();
    const size = document.getElementById("m_size").value.trim();
    const color = document.getElementById("m_color").value.trim();
    const quantity = document.getElementById("m_qty").value;
    const price = document.getElementById("m_price").value;
    const status = document.getElementById("m_status").value;
    const errEl = document.getElementById("m_err");
    if (!type){ errEl.textContent = "اختار نوع الصنف"; errEl.style.display = "block"; return; }
    if (quantity === "" || Number(quantity) < 0){ errEl.textContent = "حدد الكمية"; errEl.style.display = "block"; return; }
    mSave.disabled = true; mSave.textContent = "جاري الحفظ...";
    const item = { id, type, name, size, color, quantity:Number(quantity), price, status, _ts: Date.now() };
    try {
      await fsSetDoc("inventory", id, item);
      closeModal();
      pollOnce();
    } catch(err){
      mSave.disabled = false; mSave.textContent = "حفظ";
      errEl.textContent = "حصل خطأ في الحفظ، تأكد من الإنترنت"; errEl.style.display = "block";
    }
  });

  // customer save
  const mCSave = document.getElementById("m_csave");
  if (mCSave) mCSave.addEventListener("click", async () => {
    const id = document.getElementById("m_cid").value;
    const name = document.getElementById("m_cname").value.trim();
    const phone = document.getElementById("m_cphone").value.trim();
    const measurements = document.getElementById("m_cmeas").value.trim();
    const notes = document.getElementById("m_cnotes").value.trim();
    const errEl = document.getElementById("m_cerr");
    if (!name){ errEl.textContent = "اكتب اسم العميل"; errEl.style.display = "block"; return; }
    mCSave.disabled = true; mCSave.textContent = "جاري الحفظ...";
    const c = { id, name, phone, measurements, notes, _ts: Date.now() };
    try {
      await fsSetDoc("customers", id, c);
      closeModal();
      pollOnce();
    } catch(err){
      mCSave.disabled = false; mCSave.textContent = "حفظ";
      errEl.textContent = "حصل خطأ في الحفظ، تأكد من الإنترنت"; errEl.style.display = "block";
    }
  });

  // confirm delete
  const confirmYes = document.getElementById("confirmYes");
  const confirmCancel = document.getElementById("confirmCancel");
  if (confirmCancel) confirmCancel.addEventListener("click", () => closeModal());
  if (confirmYes && state.modal){
    if (state.modal.type === "confirmDeleteItem"){
      confirmYes.addEventListener("click", async () => {
        await fsDeleteDoc("inventory", state.modal.id);
        closeModal();
        pollOnce();
      });
    } else if (state.modal.type === "confirmDeleteCust"){
      confirmYes.addEventListener("click", async () => {
        await fsDeleteDoc("customers", state.modal.id);
        closeModal();
        pollOnce();
      });
    } else if (state.modal.type === "confirmDeleteUser"){
      confirmYes.addEventListener("click", async () => {
        await fsDeleteDoc("users", state.modal.id);
        await refreshUsersCache();
        state.modal = { type:"users" };
        renderModalInto();
      });
    }
  }

  // users modal
  const nuShow = document.getElementById("nu_show");
  if (nuShow) nuShow.addEventListener("click", () => { state.modal = { type:"users", showAdd:true }; renderModalInto(); });
  const nuCancel = document.getElementById("nu_cancel");
  if (nuCancel) nuCancel.addEventListener("click", () => { state.modal = { type:"users" }; renderModalInto(); });
  const nuAdd = document.getElementById("nu_add");
  if (nuAdd) nuAdd.addEventListener("click", async () => {
    const name = document.getElementById("nu_name").value.trim();
    const pin = document.getElementById("nu_pin").value;
    const errEl = document.getElementById("nu_err");
    if (!name){ errEl.textContent = "اكتب اسم المستخدم"; errEl.style.display = "block"; return; }
    if (state.usersCache.some(u => u.username.trim().toLowerCase() === name.toLowerCase())){ errEl.textContent = "اسم المستخدم ده مستخدم قبل كده"; errEl.style.display = "block"; return; }
    if (pin.length < 4){ errEl.textContent = "كلمة السر لازم 4 أرقام على الأقل"; errEl.style.display = "block"; return; }
    nuAdd.disabled = true; nuAdd.textContent = "جاري الإضافة...";
    try {
      const newId = uid();
      await fsSetDoc("users", newId, { id:newId, username:name, pin:pin, role:"staff" });
    } catch(e){}
    await refreshUsersCache();
    state.modal = { type:"users" };
    renderModalInto();
  });
  document.querySelectorAll("[data-del-user]").forEach(btn => {
    btn.addEventListener("click", () => { openModal({ type:"confirmDeleteUser", id: btn.getAttribute("data-del-user") }); });
  });
}

function bindShellDashboardClicks(){
  document.querySelectorAll("[data-view]").forEach(el => {
    el.addEventListener("click", () => { state.view = el.getAttribute("data-view"); render(); });
  });
}

/* =========================================================
   boot
   ========================================================= */
window.addEventListener("online", () => { state.online = true; renderSyncBadge(); });
window.addEventListener("offline", () => { state.online = false; renderSyncBadge(); });
boot();
</script>
